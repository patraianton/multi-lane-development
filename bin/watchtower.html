    + sprintBandTable(c) + '</article><div class="sprint-card-detail" data-sprint-detail="' + esc(c.id) + '"'
    + (open ? '' : ' hidden') + '>' + pcard(c) + '</div></div>';
}

function pipelinePrChip(p) {
  if (!p || typeof p !== 'object') return '';
  const ci = p.ci && typeof p.ci === 'object' ? p.ci : {};
  const label = p.number != null ? '#' + p.number : (p.title || p.url || '');
  if (!String(label).trim()) return '';
  const detail = [];
  if (ci.text) detail.push(ci.text);
  else if (p.status) detail.push(p.status);
  if (p.draft) detail.push('draft');
  if (p.via) detail.push(p.via);
  const color = ['green', 'red', 'run'].includes(ci.color) ? ' ci-' + ci.color : '';
  const content = '<span class="chip-key">PR</span><span class="chip-value">' + esc(label)
    + (detail.length ? ' · ' + detail.map(esc).join(' · ') : '') + '</span>';
  return p.url
    ? '<a class="meta-chip pr-chip' + color + '" target="_blank" rel="noreferrer" href="'
      + esc(p.url) + '" title="' + esc(p.url) + '">' + content + '</a>'
    : '<span class="meta-chip pr-chip' + color + '">' + content + '</span>';
}

// reviewRounds is not part of the card contract yet. This display-only reader
// accepts either one count or a per-spec object once a future response includes
// it; absent data produces no markup at all.
function reviewRoundCounters(rounds) {
  if (rounds == null) return '';
  const entries = rounds && typeof rounds === 'object' && !Array.isArray(rounds)
    ? Object.entries(rounds)
    : [['review', rounds]];
  return entries.map(([label, count]) => {
    if (count == null || typeof count === 'object' || String(count).trim() === '') return '';
    const one = Number(count) === 1;
    return '<span class="counter-item review-counter"><span class="counter-label">'
      + esc(label) + '</span><span class="row cnt"><b>' + esc(count) + '</b> '
      + (one ? 'round' : 'rounds') + '</span></span>';
  }).join('');
}

function pcard(c) {
  const cl = calcClocks(c);
  const open = openCards.has(c.id);
  const bits = [];

  // A card that knows its herdr window gets a clickable title: the click asks
  // herdr to switch to that window, same as a click on a windows-view card.
  bits.push('<div class="top"><span class="nm"'
    + (c.window ? ' data-window="' + esc(c.window) + '" title="open the ' + esc(c.window) + ' window in herdr"' : '')
    + '>' + esc(c.title) + '</span><span class="fold-mark" aria-hidden="true"></span></div>');
  bits.push('<div class="row mono scanline"><span class="stage-badge">'
    + esc(STAGE_TITLE[c.stage] ?? c.stage) + '</span><span class="card-id" title="' + esc(c.id) + '">'
    + esc(c.id) + '</span><span class="total-clock"><span class="clock-label">total</span>'
    + clockSpan('clk', cl.total, cl.totalFrom) + '</span></div>');

  // An open card never shows the whole spec — a real one is hundreds of lines
  // and would swallow the board. It shows the summary (or, without one, the
  // first lines of the spec, marked as the start), and the full text is a
  // plain-text page behind the "spec (N lines)" link.
  const specText = (c.spec || '').trim() ? c.spec : '';
  const specLines = specText ? specText.trim().split(/\r?\n/).length : 0;
  const summary = [];
  if ((c.summary || '').trim()) {
    summary.push('<h3>summary</h3><div class="spec">' + esc(c.summary) + '</div>');
  } else if (specText) {
    const lines = specText.trim().split(/\r?\n/);
    summary.push('<h3>spec — the start</h3><div class="spec">'
      + esc(lines.slice(0, 10).join('\n')) + (lines.length > 10 ? '\n…' : '') + '</div>');
  }
  if (specText) {
    summary.push('<div class="row spec-jump"><a class="spec-link" target="_blank"'
      + ' href="/pipeline/card/' + encodeURIComponent(c.id) + '/spec">'
      + 'spec (' + specLines + ' line' + (specLines === 1 ? '' : 's') + ')</a></div>');
  }
  if (summary.length) {
    bits.push('<div class="open-only"><section class="card-section summary-section">'
      + summary.join('') + '</section></div>');
  }

  const signals = [];
  if (usesSubscriptions && c.stage === 'grilled' && !(c.subscription || '').trim()) {
    signals.push('<div class="row callout">waiting for a subscription</div>');
  }
  if (c.stage === 'ticketed' && !(c.links?.ticket || '').trim()) {
    signals.push('<div class="row callout">waiting for the ticket link</div>');
  }
  const statusHtml = statusLine(c);
  if (statusHtml) signals.push(statusHtml);

  if (signals.length) bits.push('<div class="signals">' + signals.join('') + '</div>');

  // Attachments live in a flexing chip rail: current links and plain metadata
  // share it with the future PR list, so long values never force a column wide.
  // A sprint card shows its lanes as a table below; the free-text `lane`
  // field is that table's ancestor and would only repeat it.
  const sprint = c.sprint && typeof c.sprint === 'object' ? c.sprint : null;
  // A unit card names its sprint first, then what the facts say about it.
  if (c.parent) {
    const uf = c.unitFacts && typeof c.unitFacts === 'object' ? c.unitFacts : null;
    const parentTitle = c.sprintTitle || c.parent;
    const pieces = ['<span class="meta-chip unit-parent" title="' + esc('sprint ' + c.parent + ' — ' + parentTitle) + '">'
      + '<span class="chip-key">&#8627; sprint</span><span class="chip-value">' + esc(parentTitle) + '</span></span>'];
    // Where the unit is, always (owner, 29.08): its development lane and its
    // CI slot, a dash when there is none — so the absence is on the card too.
    if (uf && uf.lane) {
      const where = uf.lane.server || uf.lane.host || '';
      const folder = uf.lane.folder && uf.lane.folder !== uf.lane.lane ? ' · folder ' + uf.lane.host + '/' + uf.lane.folder : '';
      const mode = uf.lane.check ? 'checking' : (uf.lane.busy ? 'building' : 'idle');
      pieces.push('<span class="meta-chip lane-chip ' + (uf.lane.busy ? 'busy' : 'idle') + '" title="'
        + esc(where + folder + (uf.lane.branch ? ' · ' + uf.lane.branch : '') + (uf.lane.since ? ' · since ' + uf.lane.since : '')) + '">'
        + '<span class="chip-key">lane</span>'
        + '<span class="chip-value">' + esc(uf.lane.lane) + ' · ' + mode + (where ? ' · ' + esc(where) : '') + '</span></span>');
    } else if (uf) {
      const why = (c.links && c.links.branch)
        ? 'no lane has this branch checked out (' + c.links.branch + ')'
        : 'the ticket pins no branch, so no lane can be bound to this unit';
      pieces.push('<span class="meta-chip lane-chip none" title="' + esc(why) + '">'
        + '<span class="chip-key">lane</span><span class="chip-value">—</span></span>');
    }
    if (uf && (uf.merged || uf.pr)) {
      pieces.push(pipelinePrChip(uf.merged
        ? { number: uf.merged.number, url: uf.merged.url, status: 'merged', ci: { color: 'green', text: 'merged' } }
        : uf.pr));
    }
    // The CI slot: which slot (FLEET.md name), its runner, for how long — or
    // why there is none (no job right now, no PR at all).
    if (uf && uf.pr && uf.pr.runner && !uf.merged) {
      const r = uf.pr.runner;
      const when = r.status === 'in_progress' ? (r.since ? 'running ' + esc(ago(r.since)).replace(' ago', '') : 'running') : 'queued';
      pieces.push('<span class="meta-chip lane-chip busy" title="' + esc('CI job ' + (r.job || '') + ' on ' + (r.name || '?') + (r.server ? ' — ' + r.server : (r.host ? ' (' + r.host + ')' : ''))) + '">'
        + '<span class="chip-key">CI</span>'
        + '<span class="chip-value">' + esc(r.slot || r.name || 'slot?') + ' · ' + when + (r.slot && r.name && r.slot !== r.name ? ' · ' + esc(r.name) : '') + '</span></span>');
    } else if (uf && uf.pr && !uf.merged) {
      const ci = uf.pr.ci && uf.pr.ci.text ? uf.pr.ci.text : 'no checks';
      pieces.push('<span class="meta-chip lane-chip none" title="' + esc('no CI job is running for PR #' + uf.pr.number + ' right now — ' + ci) + '">'
        + '<span class="chip-key">CI</span><span class="chip-value">— · ' + esc(ci) + '</span></span>');
    } else if (uf && !uf.merged) {
      pieces.push('<span class="meta-chip lane-chip none" title="no PR yet, so no CI slot">'
        + '<span class="chip-key">CI</span><span class="chip-value">—</span></span>');
    }
    bits.push('<div class="row mono chip-row">' + pieces.join('') + '</div>');
    // The ticket's dependencies, each with the state of the unit it names.
    if (uf && Array.isArray(uf.deps) && uf.deps.length) {
      const chips = uf.deps.map(d => {
        const cls = d.met ? 'met' : (d.met === false ? 'open' : 'outside');
        const name = (d.unit ? d.unit + ' ' : '') + '#' + d.ticket;
        return '<span class="meta-chip dep-chip ' + cls + '" title="' + esc('depends on ' + name + ' — ' + (d.state || '?')) + '">'
          + '<span class="chip-key">' + esc(name) + '</span><span class="chip-value">' + esc(d.state || '?') + '</span></span>';
      });
      bits.push('<div class="row mono chip-row deps-row">'
        + '<span class="deps-label">depends on</span>' + chips.join('') + '</div>');
    }
    if (uf && uf.state) {
      bits.push('<div class="row unit-state st-' + esc(String(uf.state).replace(/\s+/g, '-')) + '">' + esc(uf.state)
        + (uf.open === false && !uf.merged ? ' · ticket closed' : '') + '</div>');
    }
  }
  const attached = ATTACH_FIELDS
    .filter(k => !(k === 'lane' && sprint && sprint.lanes.length))
    .filter(k => !(c.parent && (k === 'lane' || k === 'pr')))
    .filter(k => (LINK_FIELDS.includes(k) ? c.links?.[k] : c[k]))
    .map(k => {
      const value = LINK_FIELDS.includes(k) ? c.links[k] : c[k];
      const content = '<span class="chip-key">' + esc(k) + '</span><span class="chip-value">'
        + esc(LINK_FIELDS.includes(k) ? shortLink(k, value) : value) + '</span>';
      // A branch name is not an address: only a real URL becomes a link.
      return LINK_FIELDS.includes(k) && /^https?:[/][/]/.test(String(value))
        ? '<a class="meta-chip" target="_blank" rel="noreferrer" href="' + esc(value)
          + '" title="' + esc(value) + '">' + content + '</a>'
        : '<span class="meta-chip" title="' + esc(value) + '">' + content + '</span>';
    });
  if (Array.isArray(c.prs)) attached.push(...c.prs.map(pipelinePrChip).filter(Boolean));
  if (attached.length) bits.push('<div class="row mono chip-row">' + attached.join('') + '</div>');

  // A published review artifact is, before development, the card's open
  // question. The board marks it answered itself (artifactAnswered: when, how
  // many, seen by whom) the moment founder answers exist — until then the bell
  // rings. In development and later the plain link above is enough.
  if (c.links?.artifact && ['spec', 'grilled', 'ticketed'].includes(c.stage)) {
    const a = c.artifactAnswered;
    if (a && a.at) {
      const n = Number(a.answers) || 1;
      bits.push('<div class="row artifact-row"><a class="artifact-bell answered" target="_blank" rel="noreferrer" href="'
        + esc(c.links.artifact) + '" title="' + esc('answered ' + a.at + (a.by ? ' · seen by ' + a.by : '')) + '">'
        + '<span class="bell-icon">&#10003;</span>'
        + '<span class="bell-copy">artifact answered · ' + n + ' answer' + (n === 1 ? '' : 's')
        + ' · ' + esc(ago(a.at)) + '</span></a></div>');
    } else {
      bits.push('<div class="row artifact-row"><a class="artifact-bell" target="_blank" rel="noreferrer" href="'
        + esc(c.links.artifact) + '"><span class="bell-icon">&#128276;</span>'
        + '<span class="bell-copy">artifact awaits answers</span></a></div>');
    }
  }

  // ---- everything below is shown only when the card is opened
  const inner = [];
  const stages = ROAD.concat(['stuck']).filter(s => cl.byStage[s]);
  if (sprint) inner.push(sprintTable(sprint));
  inner.push('<section class="card-section time-section"><h3>time per stage</h3><div class="stage-times">'
    + stages.map(s => '<span class="stage-time"><span class="stage-name" title="'
        + esc(STAGE_TITLE[s]) + '">' + esc(STAGE_TITLE[s]) + '</span>'
        + clockSpan('clk', cl.byStage[s].base, cl.byStage[s].from) + '</span>').join('')
    + '</div>'
    + (OFF_THE_CLOCK.has(c.stage)
      ? '<span class="off-clock">The total clock is stopped here.</span>' : '')
    + '</section>');

  const comments = (c.comments ?? []).length
    ? (c.comments.map(m => '<div class="cmt"><div class="comment-meta"><b>' + esc(m.author) + '</b>'
        + '<span class="when">' + esc(ago(m.at)) + '</span></div><div class="comment-body">'
        + esc(m.text) + '</div></div>').join(''))
    : '<div class="row mono">nobody has commented</div>';
  inner.push('<section class="card-section comments-section"><h3>comments</h3>' + comments
    + '<form data-comment="' + esc(c.id) + '">'
    + '<input class="author" name="author" data-k="' + esc(c.id) + '/author" placeholder="you" maxlength="100">'
    + '<input class="text" name="text" data-k="' + esc(c.id) + '/text" placeholder="comment" maxlength="4000">'
    + '<button class="hbtn" type="submit">say</button></form></section>');

  inner.push('<section class="card-section attach-section"><h3>attach</h3><form data-attach="' + esc(c.id) + '">'
    + '<select name="field" data-k="' + esc(c.id) + '/field">'
    + ATTACH_FIELDS.map(f => '<option value="' + f + '">' + f + '</option>').join('')
    + '</select>'
    + '<input class="text" name="value" data-k="' + esc(c.id) + '/value"'
    + ' placeholder="value (empty clears it)" maxlength="400">'
    + '<button class="hbtn" type="submit">set</button></form></section>');

  bits.push('<div class="open-only">' + inner.join('') + '</div>');

  const futureCounters = Object.prototype.hasOwnProperty.call(c, 'reviewRounds')
    ? reviewRoundCounters(c.reviewRounds) : '';
  bits.push('<div class="counter-row"><span class="counter-item"><span class="counter-label">failures</span>'
    + '<span class="row cnt">' + failLine(c) + '</span></span>' + futureCounters + '</div>');

  const acts = [];
  if (c.stage === 'stuck') {
    acts.push(actBtn(c.id, 'unstuck', {}, 'unstick', 'go'));
  } else if (NEXT_STAGE[c.stage]
      && !(usesSubscriptions && c.stage === 'grilled' && !(c.subscription || '').trim())
      // The server refuses ticketed → development without a ticket link, so the
      // button is not drawn until the link is attached.
      && !(c.stage === 'ticketed' && !(c.links?.ticket || '').trim())) {
    acts.push(actBtn(c.id, 'move', { to: NEXT_STAGE[c.stage] },
      '→ ' + STAGE_TITLE[NEXT_STAGE[c.stage]], 'go'));
  }
  // Failure buttons only where something is actually run: a card in spec,
  // grilled or ticketed has nothing to fail yet, and the server refuses it
  // anyway.
  if (CAN_FAIL.indexOf(c.stage) >= 0) {
    for (const kind of ['local', 'ci', 'review']) {
      acts.push(actBtn(c.id, 'fail', { kind }, 'fail: ' + kind, 'bad'));
    }
  }
  bits.push('<div class="open-only card-footer"><div class="acts">' + acts.join('') + '</div></div>');

  const family = c.parent ? ' unit' : (sprint ? ' sprint' : '');
  const familyStyle = family ? ' style="--sprint: ' + sprintHue(c.parent || c.id) + '"' : '';
  return '<div class="pcard st-' + esc(c.stage) + family + (open ? ' open' : '') + '" data-card="' + esc(c.id) + '"'
    + familyStyle + '>' + bits.join('') + '</div>';
}

// A link chip shows what the link IS, not its address: #1515 for a ticket or
// PR, the branch name, a short page key for a review artifact. The address
// stays in the title and the href.
function shortLink(kind, url) {
  const s = String(url || '');
  const n = /\/(?:issues|pull)\/(\d+)\b/.exec(s);
  if (n) return '#' + n[1];
  if (kind === 'artifact') {
    const k = /\/session\/([0-9a-f]{16})\b/.exec(s);
    return k ? 'page ' + k[1].slice(0, 6) + '…' : 'page';
  }
  if (kind === 'branch') return s.replace(/^refs\/heads\//, '');
  return s.replace(/^https?:\/\//, '');
}

// One hue per sprint family, stable across redraws: derived from the id.
function sprintHue(id) {
  let h = 0;
  for (const ch of String(id || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return 'hsl(' + (h % 360) + ' 62% 58%)';
}

// A redraw replaces the whole pipeline, and half-typed text must survive it:
// the board refreshes every three seconds and a comment takes longer to write
// than that. Every field carries a key of its own (card id + field name), so
// what was typed — and where the cursor sat — is put back after the redraw.
function snapshotInputs() {
  const values = new Map();
  for (const el of document.querySelectorAll('#pipeline [data-k]')) {
    if (el.value) values.set(el.dataset.k, el.value);
  }
  const active = document.activeElement;
  const focus = active && active.dataset && active.dataset.k
    && active.closest && active.closest('#pipeline') ? active.dataset.k : null;
  return { values, focus };
}

function restoreInputs(snap) {
  for (const el of document.querySelectorAll('#pipeline [data-k]')) {
    const v = snap.values.get(el.dataset.k);
    if (v !== undefined) el.value = v;
  }
  if (!snap.focus) return;
  for (const el of document.querySelectorAll('#pipeline [data-k]')) {
    if (el.dataset.k !== snap.focus) continue;
    el.focus();
    try { el.setSelectionRange(el.value.length, el.value.length); } catch (e) {}
    return;
  }
}

function renderPipeline(d) {
  const snap = snapshotInputs();
  usesSubscriptions = Boolean(d.usesSubscriptions);
  const cards = d.cards ?? [];
  const stuck = cards.filter(c => c.stage === 'stuck');

  // The header counts what this view is about: cards on the road, cards that
  // are done, and cards that are looping.
  const moving = cards.filter(c => !['stuck', 'done'].includes(c.stage)).length;
  const ob = d.offBoard && typeof d.offBoard === 'object' ? d.offBoard : {};
  const obList = Array.isArray(ob.findings) ? ob.findings : [];
  const swept = d.swept && typeof d.swept === 'object' ? d.swept : { age: '-', stuck: false };
  $('swept').textContent = 'swept ' + swept.age + ' ago';
  $('swept').classList.toggle('stale', swept.stuck === true);
  $('pipe-counts').innerHTML = '<b>' + cards.length + '</b> cards · <b>' + moving + '</b> moving · <b>'
    + stuck.length + '</b> stuck · <b>'
    + cards.filter(c => c.stage === 'done').length + '</b> done'
    + (obList.length ? ' · <b class="ob-count">' + obList.length + '</b> off the board' : '');

  // A sprint that has split into unit cards is shown in the band above the
  // columns, not in a column.
  const bandIds = new Set(cards.filter(c => c.sprint && cards.some(u => u.parent === c.id)).map(c => c.id));
  const band = $('sprint-band');
  band.classList.toggle('on', bandIds.size > 0);
  band.innerHTML = bandIds.size
    ? '<h2>Sprint' + (bandIds.size === 1 ? '' : 's') + ' — ' + bandIds.size + ' in flight · stage follows the unit cards below</h2>'
      + '<div class="band-stack">' + cards.filter(c => bandIds.has(c.id)).map(sprintBandPanel).join('') + '</div>'
    : '';

  const zone = $('stuck-zone');
  zone.classList.toggle('on', stuck.length > 0);
  zone.innerHTML = stuck.length
    ? '<h2>Stuck — ' + stuck.length + ' card' + (stuck.length === 1 ? '' : 's')
      + ' failed ' + d.stuckAfter + ' times in a row and waits for you</h2>'
      + '<div class="lane-row">' + stuck.map(pcard).join('') + '</div>'
    : '';

  // Off the board: what is being built without a card, each with its fix.
  const obZone = $('offboard-zone');
  obZone.classList.toggle('on', obList.length > 0 || Boolean(ob.skipped));
  obZone.classList.toggle('collapsed', folds.offboard);
  obZone.innerHTML = obList.length || ob.skipped
    ? '<h2 data-ob-toggle="1" title="' + (folds.offboard ? 'open the list' : 'fold the list') + '"><span class="caret"></span>Off the board — ' + obList.length + ' thing' + (obList.length === 1 ? '' : 's') + ' being built without a card'
      + (ob.skipped ? ' · watch skipped: ' + esc(ob.skipped) : '')
      + '</h2>'
      + '<div class="ob-list">' + obList.map(f => '<div class="ob-item"><span class="ob-kind">' + esc(f.kind) + '</span>'
        + (f.url ? '<a class="ob-ref" href="' + esc(f.url) + '" target="_blank" rel="noreferrer">' + esc(f.ref) + '</a>'
          : '<span class="ob-ref">' + esc(f.ref) + '</span>')
        + ' <span class="ob-title">' + esc(f.title || '') + (f.detail ? ' · ' + esc(f.detail) : '') + '</span>'
        + '<div class="ob-why">' + esc(f.reason) + '</div><div class="ob-fix">fix: ' + esc(f.fix) + '</div></div>').join('')
      + '</div>'
    : '';

  // Auto-dispatch: review/develop launches and merge decisions, with the
  // journal's word on each (dry-run while the switch is off).
  const ad = d.autoDispatch && typeof d.autoDispatch === 'object' ? d.autoDispatch : {};
  const adRows = Array.isArray(ad.rows) ? ad.rows : [];
  const dzZone = $('dispatch-zone');
  dzZone.classList.toggle('on', adRows.length > 0);
  dzZone.classList.toggle('collapsed', folds.dispatch);
  dzZone.innerHTML = adRows.length
    ? '<h2 data-dz-toggle="1" title="' + (folds.dispatch ? 'open the list' : 'fold the list') + '"><span class="caret"></span>Auto-dispatch — ' + (ad.on ? '<b>on</b>' : 'off, dry-run') + ' · ' + adRows.length + ' line' + (adRows.length === 1 ? '' : 's') + '</h2>'
      + adRows.map(r => {
        const st = String(r.state || '');
        const cls = /^launched|^dispatched|^merged/.test(st) ? 'sent' : (/^failed|^merge failed/.test(st) ? 'bad' : '');
        if (r.kind === 'merge') {
          const words = /^would merge\b/.test(st)
            ? esc(st)
            : '<b>' + esc(r.unit || 'PR') + '</b>' + (/^hold-merge\b/.test(st) ? ': ' : ' ') + esc(st);
          return '<div class="dz-row"><b>merge</b> · ' + words + ' · ' + esc(r.card || '') + '</div>';
        }
        return '<div class="dz-row"><b>' + esc(r.unit || '-') + '</b> ' + esc(r.kind || 'develop')
          + ' → ' + esc(r.lane || '-') + ' from ' + esc(r.base || '-')
          + ' · ' + esc(r.card || '') + ' · <span class="dz-state ' + cls + '">' + esc(st) + '</span></div>';
      }).join('')
    : '';

  $('pboard').style.setProperty('--pcols', String(ROAD.length));
  const dwellNow = Date.now();
  const dwellCards = cards.filter(c => !bandIds.has(c.id));
  const reviewAvg = reviewDwell(dwellCards, dwellNow);
  $('pboard').innerHTML = ROAD.map(key => {
    const list = cards.filter(c => columnOf(c.stage) === key && !bandIds.has(c.id));
    const dwell = key === 'done' ? null : stageDwell(dwellCards, COLUMN_STAGES[key] ?? [key], dwellNow);
    const rv = key === 'ci_pr' ? reviewAvg : null;
    return '<div class="pcol ' + esc(key) + '"><h2>' + esc(STAGE_TITLE[key])
      + (dwell ? ' <em class="col-avg" title="' + esc('average time a card spends here: ' + dwell.n + ' visit'
        + (dwell.n === 1 ? '' : 's') + ', longest ' + fmtDur(dwell.max) + (dwell.open ? ', ' + dwell.open + ' still here' : '')
        + (rv ? '; a review round: avg ' + fmtDur(rv.avg) + ' over ' + rv.n + ' round' + (rv.n === 1 ? '' : 's') : ''))
        + '">avg ' + esc(fmtDur(dwell.avg)) + (rv ? ' · review ' + esc(fmtDur(rv.avg)) : '') + '</em>' : '')
      + ' <span>' + list.length + '</span></h2>'
      + (list.length ? list.map(pcard).join('') : '<div class="empty">empty</div>')
      + '</div>';
  }).join('');

  wirePipeline(d);
  restoreInputs(snap);
}

function wirePipeline(data) {
  for (const el of document.querySelectorAll('#sprint-band [data-sprint-toggle]')) {
    el.onclick = (ev) => { ev.stopPropagation(); toggleSprintFold(el.dataset.sprintToggle); };
  }
  const obHead = document.querySelector('#offboard-zone [data-ob-toggle]');
  if (obHead) {
    obHead.onclick = (ev) => { if (ev.target.closest('a')) return; ev.stopPropagation(); toggleOffBoardFold(); };
  }
  const dzHead = document.querySelector('#dispatch-zone [data-dz-toggle]');
  if (dzHead) {
    dzHead.onclick = (ev) => { if (ev.target.closest('a')) return; ev.stopPropagation(); toggleDispatchFold(); };
  }
  for (const b of document.querySelectorAll('#sprint-band [data-sprint-sort]')) {
    b.onclick = (ev) => {
      ev.stopPropagation();
      const sort = sprintBandSortState(b.dataset.sprintId);
      const key = b.dataset.sprintSort;
      if (sort.key === key) sort.dir *= -1;
      else { sort.key = key; sort.dir = 1; }
      renderPipeline(data);
    };
  }
  for (const b of document.querySelectorAll('#sprint-band [data-sprint-card]')) {
    b.onclick = (ev) => {
      ev.stopPropagation();
      const id = b.dataset.sprintCard;
      const wrap = b.closest('[data-sprint-panel]');
      const detail = wrap && wrap.querySelector('[data-sprint-detail]');
      const card = detail && detail.querySelector('.pcard');
      const open = !openCards.has(id);
      if (open) openCards.add(id); else openCards.delete(id);
      b.setAttribute('aria-expanded', String(open));
      if (detail) detail.hidden = !open;
      if (card) card.classList.toggle('open', open);
    };
  }
  // A title with a window behind it jumps into that herdr window. The window is
  // found by name in the windows board's latest data; a window that is not
  // there (closed, hidden, another project) is said out loud, not swallowed.
  for (const el of document.querySelectorAll('#pipeline .nm[data-window]')) {
    el.onclick = (ev) => {
      ev.stopPropagation();
      const name = el.dataset.window;
      const win = ((lastData && lastData.cards) || [])
        .find(c => !c.manual && (c.name === name || c.window === name));
      if (win && win.tab) post('/focus', { tab: win.tab });
      else showError('window "' + name + '" is not on the windows board right now');
    };
  }
  for (const el of document.querySelectorAll('#pipeline .pcard')) {
    el.onclick = (ev) => {
      // A click on a control is that control's business, not a card toggle.
      if (ev.target.closest('button, input, select, a, form')) return;
      const id = el.dataset.card;
      if (openCards.has(id)) openCards.delete(id); else openCards.add(id);
      const open = openCards.has(id);
      el.classList.toggle('open', open);
      const detail = el.closest('[data-sprint-detail]');
      if (detail) {
        detail.hidden = !open;
        const wrap = detail.closest('[data-sprint-panel]');
        const toggle = wrap && wrap.querySelector('[data-sprint-card]');
        if (toggle) toggle.setAttribute('aria-expanded', String(open));
      }
    };
  }
  for (const b of document.querySelectorAll('#pipeline [data-act]')) {
    b.onclick = async (ev) => {
      ev.stopPropagation();
      const body = Object.assign({ id: b.dataset.id }, JSON.parse(b.dataset.body));
      const r = await post('/pipeline/card/' + b.dataset.act, body);
      if (r && r.error) { showError('the card did not move: ' + r.error); return; }
      pipePoll();
    };
  }
  for (const f of document.querySelectorAll('#pipeline form[data-comment]')) {
    f.onsubmit = async (ev) => {
      ev.preventDefault();
      const authorEl = f.querySelector('[name=author]');
      const textEl = f.querySelector('[name=text]');
      const author = authorEl ? authorEl.value.trim() : '';
      const text = textEl.value.trim();
      if (!text || !author) {
        showError('a comment needs an author and a text');
        return;
      }
      const body = { id: f.dataset.comment, text };
      if (author) body.author = author;
      const r = await post('/pipeline/card/comment', body);
      if (r && r.error) { showError('the comment was not saved: ' + r.error); return; }
      textEl.value = '';
      pipePoll();
    };
  }
  for (const f of document.querySelectorAll('#pipeline form[data-attach]')) {
    f.onsubmit = async (ev) => {
      ev.preventDefault();
      const valueEl = f.querySelector('[name=value]');
      const field = f.querySelector('[name=field]').value;
      const value = valueEl.value.trim();
      const body = { id: f.dataset.attach };
      if (LINK_FIELDS.includes(field)) body.links = { [field]: value };
      else body[field] = value;
      const r = await post('/pipeline/card/update', body);
      if (r && r.error) { showError('the card was not updated: ' + r.error); return; }
      valueEl.value = '';
      pipePoll();
    };
  }
}

async function pipePoll() {
  if (pipeTimer) { clearTimeout(pipeTimer); pipeTimer = null; }
  void refreshJournal();
  try {
    const r = await fetch('/pipeline/data', { cache: 'no-store' });
    const d = await r.json();
    const seen = JSON.stringify(d);
    // An unchanged pipeline is not redrawn at all: the cheapest way to leave
    // what the owner is doing alone. A changed one is redrawn with the typed
    // text and the cursor carried across.
    if (seen !== pipeSeen) {
      pipeSeen = seen;
      lastPipe = d;
      renderPipeline(d);
    }
    tickClocks();
  } catch (e) {
    showError('the pipeline did not answer: ' + (e && e.message ? e.message : e));
  } finally {
    pipeTimer = setTimeout(pipePoll, 3000);
  }
}

$('pipe-add-toggle').onclick = () => {
  const open = $('pipebar').classList.toggle('open');
  $('pipe-add-toggle').classList.toggle('on', open);
  if (open) $('pipe-title').focus();
};

$('pipe-form').onsubmit = async (ev) => {
  ev.preventDefault();
  const title = $('pipe-title').value.trim();
  if (!title) { $('pipe-note').textContent = 'a title is required'; $('pipe-title').focus(); return; }
  $('pipe-note').textContent = '';
  const r = await post('/pipeline/card/create',
    { title, spec: $('pipe-spec').value, summary: $('pipe-summary').value });
  if (r && r.error) { $('pipe-note').textContent = r.error; return; }
  $('pipe-title').value = '';
  $('pipe-spec').value = '';
  $('pipe-summary').value = '';
  $('pipe-note').textContent = 'added to Spec';
  setTimeout(() => { $('pipe-note').textContent = ''; }, 2000);
  pipePoll();
};

pipePoll();

let failures = 0;
let pollTimer = null;
async function poll() {
  // poll() is called both on a timer and right after a hand edit. The previous
  // timer is cleared, otherwise polls would multiply with every edit.
  if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
  try {
    const r = await fetch('/data', { cache: 'no-store' });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    const old = document.querySelector('.err');
    if (old) old.remove();
    failures = 0;
    render(d);
  } catch (e) {
    failures++;
    if (failures >= 2) showError('the board received no data: ' + (e && e.message ? e.message : e));
  } finally {
    pollTimer = setTimeout(poll, 3000);
  }
}
poll();
</script>
</body>
</html>

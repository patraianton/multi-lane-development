<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watchtower</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: dark;
    --bg: #080d13;
    --panel: #111b26;
    --panel-hi: #172433;
    --panel-low: #0a1119;
    --line: #253445;
    --line-hot: #40546a;
    --ink: #e5edf5;
    --ink-mid: #9cafc1;
    --ink-dim: #617487;
    --blocked: #ff5c5f;
    --done: #ffb44a;
    --working: #35d6a0;
    --idle: #718397;
    --unknown: #53606f;
    --focus: #78ddff;
    --violet: #b99cff;
    --panel-lift: #142131;
    --line-soft: #1c2a39;
    --shadow-deep: rgba(0, 0, 0, .34);
    --ui: "Segoe UI", system-ui, sans-serif;
    --mono: Consolas, "Cascadia Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; }
  body {
    /* A column of fixed-height strips with one scrolling area at the bottom.
       Which scrolling area that is depends on the view: the windows board or
       the pipeline. Both are the last child in their view and both grow. */
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--ui);
    font-size: 13px;
    overflow: hidden;
  }

  /* ---- header: title, counters, "+", gear. Nothing else. ---- */
  header {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; min-width: 0;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #121c28, #0c141d);
  }
  header h1 {
    margin: 0; font-size: 15px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
  }
  header h1 .proj { color: var(--focus); font-weight: 600; letter-spacing: .04em; text-transform: none; }
  header .num { color: var(--ink-mid); font-family: var(--mono); font-size: 12px; }
  header .num b { color: var(--ink); }
  header .flag { color: var(--blocked); font-family: var(--mono); font-size: 12px; }
  header .swept { color: var(--ink-dim); font-family: var(--mono); font-size: 11px; }
  header .swept.stale { color: var(--blocked); }
  header .spacer { margin-left: auto; }

  .hbtn {
    font-family: var(--ui); font-size: 11px; line-height: 1.5;
    padding: 1px 8px; border: 1px solid var(--line); border-radius: 9px;
    background: var(--panel-low); color: var(--ink-mid); cursor: pointer;
  }
  .hbtn:hover { border-color: var(--line-hot); color: var(--ink); }
  .hbtn.on { border-color: var(--focus); color: var(--focus); }
  .hbtn.plus { font-size: 13px; font-weight: 700; padding: 0 8px; }
  .hbtn.gear { font-size: 12px; padding: 0 7px; }

  /* ---- "add a card" bar ---- */
  .handbar {
    display: none; gap: 10px 18px; flex-wrap: wrap; align-items: flex-start;
    padding: 8px 12px; border-bottom: 1px solid var(--line); background: #0c141d;
  }
  .handbar.open { display: flex; }
  .handbar form { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .handbar input, .handbar select {
    font-family: var(--ui); font-size: 12px; padding: 3px 6px;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 3px;
  }
  .handbar input:focus, .handbar select:focus { outline: none; border-color: var(--focus); }
  .handbar input.t { width: 240px; }
  .handbar input.txt { width: 320px; }
  .handbar .note { font-size: 11px; color: var(--ink-dim); }

  /* ---- settings / onboarding ---- */
  .sheet {
    display: none; position: fixed; inset: 0; z-index: 20;
    background: rgba(4, 8, 12, .82); padding: 6vh 4vw; overflow: auto;
  }
  .sheet.open { display: block; }
  .sheet .box {
    max-width: 720px; margin: 0 auto; padding: 18px 20px 20px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
  }
  .sheet h2 { margin: 0 0 4px; font-size: 16px; }
  .sheet p { margin: 0 0 14px; color: var(--ink-mid); font-size: 12px; line-height: 1.45; }
  .sheet h3 {
    margin: 18px 0 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-mid); border-bottom: 1px solid var(--line); padding-bottom: 4px;
  }
  .sheet .close { position: absolute; top: 12px; right: 16px; }
  .plist { display: grid; gap: 6px; }
  .plist button {
    display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left;
    font-family: var(--ui); font-size: 13px; padding: 6px 10px;
    border: 1px solid var(--line); border-radius: 5px;
    background: var(--panel-low); color: var(--ink); cursor: pointer;
  }
  .plist button:hover { border-color: var(--focus); background: var(--panel-hi); }
  .plist button.cur { border-color: var(--focus); color: var(--focus); }
  .plist button .meta { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-dim); }
  .hidden-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .hidden-list .item {
    display: inline-flex; align-items: baseline; gap: 6px;
    padding: 1px 6px; border: 1px solid var(--line); border-radius: 9px;
    font-size: 11px; color: var(--ink-mid);
  }
  .hidden-list .item button {
    font-family: var(--ui); font-size: 10.5px; padding: 0 5px;
    border: 1px solid var(--line); border-radius: 8px;
    background: transparent; color: var(--working); cursor: pointer;
  }
  .hidden-list .item button:hover { border-color: #1f6a52; }
  .note { font-size: 11px; color: var(--ink-dim); }

  .chip {
    display: inline-block; margin: 3px 4px 0 0; padding: 1px 6px; border-radius: 9px;
    border: 1px solid var(--line); font-family: var(--mono); font-size: 10.5px; color: var(--ink-mid);
  }
  .chip a { color: inherit; text-decoration: none; border-bottom: 1px dotted currentColor; }
  .empty { color: var(--ink-dim); font-size: 11px; padding: 4px 6px; }
  .err { margin: 6px 12px; padding: 6px 9px; border: 1px solid #6a2224; background: #1d0f11; color: #ffb3b4;
         font-family: var(--mono); font-size: 11px; }

  /* ---- the pipeline — the page. The windows view (live herdr windows in
     columns, the lane strip) was cut on 2026-08-29 by the owner's word: the
     board is the road, not a mirror of windows. A column here is a stage of
     the road. ---- */
  .pipeline {
    display: block; flex: 1 1 auto; min-height: 0; overflow: auto;
    padding: 11px 14px 20px; scrollbar-gutter: stable;
  }

  /* Sprints that have split into unit cards live here, above the columns:
     a sprint does not move on its own — its stage follows its units — and
     the columns are for the work. */
  .sprint-band { display: none; margin: 0 0 12px; }
  .sprint-band.on { display: block; }
  .sprint-band > h2 {
    margin: 0 0 6px; font: 700 10px/1 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim);
  }
  .sprint-band .band-stack { display: grid; gap: 10px; width: 100%; max-width: 1840px; min-width: 0; }
  .sprint-band .sprint-panel-wrap { min-width: 0; }
  /* The big blocks fold (owner, 29.08): a sprint collapses to one line — name,
     stage, clock, the unit counts, the QA line, free lanes — and opens on a
     click; the off-board and auto-dispatch zones fold to their headings.
     Folded by default; what the owner opened stays open in this browser. */
  .sprint-band .sprint-brief {
    display: none; align-items: center; flex-wrap: wrap; gap: 8px 12px; min-width: 0; padding: 9px 12px;
    border: 1px solid var(--line); border-left: 3px solid var(--sprint); border-radius: 9px; cursor: pointer;
    background: linear-gradient(145deg, var(--panel-lift), var(--panel) 54%, #0f1924);
    box-shadow: 0 6px 16px var(--shadow-deep), inset 0 1px rgba(255, 255, 255, .035);
  }
  .sprint-band .sprint-brief:hover { border-color: var(--line-hot); }
  .sprint-band .sprint-panel-wrap.collapsed .sprint-brief { display: flex; }
  .sprint-band .sprint-panel-wrap.collapsed .sprint-panel,
  .sprint-band .sprint-panel-wrap.collapsed .sprint-card-detail { display: none; }
  .sprint-band .sprint-brief .caret, .sprint-band .fold-btn .caret, .offboard-zone .caret, .dispatch-zone .caret, .journal-zone .caret {
    display: inline-block; width: 0; height: 0; border-left: 5px solid currentColor;
    border-top: 4px solid transparent; border-bottom: 4px solid transparent; transition: transform 120ms ease;
  }
  .sprint-band .sprint-brief .name { min-width: 0; color: var(--ink); font-weight: 750; font-size: 13px; overflow-wrap: anywhere; }
  .sprint-band .sprint-brief .stat { color: var(--ink-mid); font: 10px var(--mono); white-space: nowrap; }
  .sprint-band .sprint-brief .stat b { color: var(--ink); font-weight: 700; }
  .sprint-band .sprint-brief .stat.qa b { color: var(--done); }
  .sprint-band .sprint-brief .stat.qa.clean b { color: var(--working); }
  .sprint-band .sprint-brief .hint { margin-left: auto; color: var(--ink-dim); font: 9px var(--mono); white-space: nowrap; }
  .sprint-band .fold-btn {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 5px; padding: 3px 7px; border: 1px solid var(--line);
    border-radius: 10px; background: rgba(8, 13, 19, .58); color: var(--ink-dim); cursor: pointer; font: 700 9px/1.2 var(--mono);
  }
  .sprint-band .fold-btn:hover { color: var(--focus); border-color: #31556a; }
  .sprint-band .fold-btn .caret { transform: rotate(90deg); }
  .offboard-zone > h2 { cursor: pointer; }
  .offboard-zone > h2 .caret { margin-right: 6px; transform: rotate(90deg); }
  .offboard-zone.collapsed > h2 { margin-bottom: 0; }
  .offboard-zone.collapsed > h2 .caret { transform: none; }
  .offboard-zone.collapsed .ob-list { display: none; }
  .sprint-band .sprint-panel {
    display: grid; grid-template-columns: minmax(340px, 470px) minmax(0, 1fr); min-width: 0; overflow: hidden;
    border: 1px solid var(--line); border-left: 3px solid var(--sprint); border-radius: 9px;
    background:
      radial-gradient(circle at 0 0, rgba(120, 221, 255, .075), transparent 34%),
      linear-gradient(145deg, var(--panel-lift), var(--panel) 54%, #0f1924);
    box-shadow: 0 8px 22px var(--shadow-deep), inset 0 1px rgba(255, 255, 255, .035);
  }
  .sprint-band .sprint-summary {
    display: grid; align-content: start; gap: 11px; min-width: 0; padding: 13px;
    border-right: 1px solid var(--line); background: rgba(8, 13, 19, .18);
  }
  .sprint-band .sprint-identity { min-width: 0; }
  .sprint-band .sprint-name-row { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }
  .sprint-band .sprint-name {
    flex: 1 1 auto; min-width: 0; margin: 0; color: var(--ink); font-size: 15px;
    font-weight: 750; line-height: 1.25; letter-spacing: -.012em; overflow-wrap: anywhere;
  }
  .sprint-band .card-toggle {
    flex: 0 0 auto; padding: 3px 7px; border: 1px solid #31556a; border-radius: 10px;
    background: rgba(8, 22, 30, .72); color: var(--focus); cursor: pointer;
    font: 700 9px/1.2 var(--mono); text-transform: lowercase;
  }
  .sprint-band .card-toggle:hover, .sprint-band .card-toggle[aria-expanded="true"] {
    border-color: var(--focus); background: rgba(23, 54, 69, .78);
  }
  .sprint-band .identity-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 6px; }
  .sprint-band .badge, .sprint-band .clock, .sprint-band .mini-link, .sprint-band .source-health {
    display: inline-flex; align-items: center; min-width: 0; border: 1px solid var(--line);
    border-radius: 12px; background: rgba(8, 13, 19, .58); white-space: nowrap;
  }
  .sprint-band .badge {
    padding: 3px 7px; border-color: #31556a; color: var(--focus);
    font: 700 9px/1.2 var(--mono); letter-spacing: .05em; text-transform: uppercase;
  }
  .sprint-band .clock { gap: 4px; padding: 3px 7px; border-color: #24475a; color: var(--focus); }
  .sprint-band .clock small {
    color: var(--ink-dim); font: 700 8px/1 var(--ui); letter-spacing: .06em; text-transform: uppercase;
  }
  .sprint-band .clock .clk { color: var(--focus); font: 700 10px/1.2 var(--mono); }
  .sprint-band .clock .clk.stopped { color: var(--ink-dim); }
  .sprint-band .links { display: flex; flex-wrap: wrap; align-content: start; gap: 4px; min-width: 0; }
  .sprint-band .mini-link {
    gap: 4px; max-width: 100%; margin: 0; padding: 3px 7px; color: var(--ink-mid);
    font: 9px/1.2 var(--mono); text-decoration: none;
  }
  .sprint-band a.mini-link:hover { border-color: #37657a; background: rgba(18, 38, 49, .74); color: var(--focus); }
  .sprint-band .mini-link b {
    color: var(--ink-dim); font: 700 8px/1 var(--ui); letter-spacing: .06em; text-transform: uppercase;
  }
  .sprint-band .mini-link span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .sprint-band .progress-block { min-width: 0; }
  .sprint-band .progress-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px;
  }
  .sprint-band .progress-head b { color: var(--ink); font-size: 11px; }
  .sprint-band .progress-head span { color: var(--ink-dim); font: 9px var(--mono); }
  .sprint-band .segment-bar { display: flex; gap: 2px; min-width: 0; }
  .sprint-band .segment-bar i {
    display: block; flex: 1 1 0; min-width: 3px; height: 8px; border-radius: 2px; background: var(--unknown);
  }
  .sprint-band .segment-bar i.st-on-lane { background: var(--focus); }
  .sprint-band .segment-bar i.st-lane-idle, .sprint-band .segment-bar i.st-local-check { background: var(--done); }
  .sprint-band .segment-bar i.st-pr-open { background: var(--violet); }
  .sprint-band .segment-bar i.st-pr-green, .sprint-band .segment-bar i.st-merged { background: var(--working); }
  .sprint-band .segment-bar i.st-pr-red { background: var(--blocked); }
  .sprint-band .legend {
    display: flex; flex-wrap: wrap; gap: 5px 11px; margin-top: 7px; color: var(--ink-dim); font: 9px/1.2 var(--mono);
  }
  .sprint-band .legend span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .sprint-band .legend i { width: 6px; height: 6px; border-radius: 2px; background: var(--unknown); }
  .sprint-band .legend .on-lane i { background: var(--focus); }
  .sprint-band .legend .checking i { background: var(--done); }
  .sprint-band .legend .pr i { background: var(--violet); }
  .sprint-band .legend .merged i { background: var(--working); }
  /* QA tickets: the findings the sprint's reviews left behind — not scope, so
     not in the bar; the sprint waits in QA while one is open. */
  .sprint-band .qa-line { margin-top: 6px; min-width: 0; overflow-wrap: anywhere; font: 10px var(--mono); color: var(--ink-mid); }
  .sprint-band .qa-line b { color: var(--done); font-family: var(--ui); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; }
  .sprint-band .qa-line a { color: var(--done); text-decoration: none; }
  .sprint-band .qa-line a:hover { text-decoration: underline; }
  .sprint-band .qa-line a.closed { color: var(--working); }
  .sprint-band .qa-line.clean b { color: var(--working); }
  /* The lanes of the fleet as a table across the whole pane — the same table
     as "in flight", a size smaller: lane (FLEET.md name), server, state, who
     is on it. The chips (ticket, artifact, subscription, sources) share one
     row underneath. */
  .sprint-band .lanes-block { min-width: 0; }
  .sprint-band .lanes-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 3px; }
  .sprint-band .lanes-head strong { color: var(--ink); font-size: 12px; }
  .sprint-band .lanes-head .capacity-number { color: var(--working); font: 750 18px/1 var(--mono); }
  .sprint-band .lanes-head span { color: var(--ink-dim); font: 9px var(--mono); }
  .sprint-band .lanes-table { font-size: 9.5px; }
  .sprint-band .lanes-table th { padding: 4px 6px; }
  .sprint-band .lanes-table th button { cursor: default; }
  .sprint-band .lanes-table td { padding: 4px 6px; }
  .sprint-band .lanes-table .lane-cell { color: var(--ink); font: 750 9.5px var(--mono); }
  .sprint-band .lanes-table .cell-sub { font-size: 8px; }
  .sprint-band .lanes-table tr.outside td { opacity: .55; }
  .sprint-band .lanes-table tr.down td { color: var(--blocked); }
  .sprint-band .ci-block { margin-top: 9px; }
  .sprint-band .ci-block .capacity-number { color: var(--done); }
  .sprint-band .links.links-row { align-items: center; }
  .sprint-band .source-health { gap: 5px; padding: 3px 7px; color: var(--working); font: 9px/1.2 var(--mono); }
  .sprint-band .source-health::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .sprint-band .source-health.stale { border-color: #6a5122; color: var(--done); white-space: normal; }
  .sprint-band .table-pane { min-width: 0; padding: 10px 12px 12px; }
  .sprint-band .pane-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px;
  }
  .sprint-band .pane-head h3 { margin: 0; color: var(--ink); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
  .sprint-band .pane-head span { color: var(--ink-dim); font: 9px var(--mono); text-align: right; }
  .sprint-band .flight-table { width: 100%; min-width: 0; border-collapse: collapse; table-layout: fixed; font-size: 10px; }
  .sprint-band .flight-table th { padding: 5px 7px; border-bottom: 1px solid var(--line); text-align: left; }
  .sprint-band .flight-table th button {
    max-width: 100%; padding: 0; border: 0; background: none; color: var(--ink-dim); cursor: pointer;
    font: 700 8px var(--ui); letter-spacing: .08em; text-align: left; text-transform: uppercase;
  }
  .sprint-band .flight-table th button:hover, .sprint-band .flight-table th button.active { color: var(--focus); }
  .sprint-band .flight-table td {
    min-width: 0; padding: 7px; border-bottom: 1px solid var(--line-soft); vertical-align: top;
    color: var(--ink-mid); overflow-wrap: anywhere;
  }
  .sprint-band .flight-table tbody tr:hover { background: rgba(120, 221, 255, .035); }
  .sprint-band .unit-cell a { color: var(--ink); font: 750 10px var(--mono); text-decoration: none; }
  .sprint-band .unit-cell a:hover, .sprint-band .flight-table td a:hover { color: var(--focus); }
  .sprint-band .unit-cell small, .sprint-band .cell-sub {
    display: block; min-width: 0; margin-top: 2px; overflow: hidden; color: var(--ink-dim);
    font: 8.5px/1.3 var(--mono); text-overflow: ellipsis; white-space: nowrap;
  }
  .sprint-band .flight-table td a { color: inherit; text-decoration: none; }
  .sprint-band .state-word { font: 700 9px var(--mono); text-transform: uppercase; }
  .sprint-band .st-queued, .sprint-band .st-closed { color: var(--ink-dim); }
  .sprint-band .st-on-lane { color: var(--focus); }
  .sprint-band .st-lane-idle, .sprint-band .st-local-check { color: var(--done); }
  .sprint-band .st-pr-open { color: var(--violet); }
  .sprint-band .st-pr-green, .sprint-band .st-merged, .sprint-band .st-accepted { color: var(--working); }
  .sprint-band .st-pr-red { color: var(--blocked); }
  .sprint-band .empty-note { color: var(--ink-dim); font: 9px var(--mono); }
  .sprint-band .sprint-card-detail { min-width: 0; }
  .sprint-band .sprint-card-detail[hidden] { display: none; }
  .sprint-band .sprint-card-detail .pcard { margin: 7px 0 0; }
  .stuck-zone {
    display: none; margin-bottom: 13px; padding: 9px 10px 10px;
    border: 1px solid #6a2224; border-radius: 9px;
    background:
      radial-gradient(circle at 0 0, rgba(255, 92, 95, .09), transparent 34%),
      linear-gradient(145deg, #180d10, #100b0d);
    box-shadow: 0 10px 28px rgba(0, 0, 0, .22), inset 0 1px rgba(255, 255, 255, .025);
  }
  .stuck-zone.on { display: block; }
  .stuck-zone > h2 {
    margin: 0 0 8px; font-size: 10px; line-height: 1.35; letter-spacing: .12em;
    text-transform: uppercase; color: var(--blocked);
  }
  .stuck-zone .lane-row {
    display: grid; gap: 9px;
    grid-template-columns: repeat(auto-fill, minmax(min(260px, 100%), 1fr));
  }
  /* Off the board: work the watch found without a card — an open PR, a
     ticket in work naming no umbrella, a busy lane on an unknown branch.
     Amber, above the columns, with the fix named on every line. */
  .offboard-zone {
    display: none; margin-bottom: 13px; padding: 9px 10px 10px;
    border: 1px solid #6a5122; border-radius: 9px;
    background:
      radial-gradient(circle at 0 0, rgba(255, 180, 74, .09), transparent 34%),
      linear-gradient(145deg, #17120b, #100d09);
    box-shadow: 0 10px 28px rgba(0, 0, 0, .22), inset 0 1px rgba(255, 255, 255, .025);
  }
  .offboard-zone.on { display: block; }
  .offboard-zone > h2 {
    margin: 0 0 8px; font-size: 10px; line-height: 1.35; letter-spacing: .12em;
    text-transform: uppercase; color: var(--done);
  }
  .offboard-zone > h2 a { color: var(--done); }
  .offboard-zone .ob-list { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); }
  .offboard-zone .ob-item {
    min-width: 0; padding: 6px 8px; border: 1px solid var(--line-soft); border-radius: 6px;
    background: rgba(8, 13, 19, .45); font-size: 11px; line-height: 1.4; color: var(--ink-mid); overflow-wrap: anywhere;
  }
  .offboard-zone .ob-kind {
    display: inline-block; margin-right: 5px; padding: 1px 5px; border: 1px solid #6a5122; border-radius: 8px;
    color: var(--done); font: 700 8px var(--mono); letter-spacing: .08em; text-transform: uppercase;
  }
  .offboard-zone .ob-ref { color: var(--ink); font: 750 11px var(--mono); text-decoration: none; }
  .offboard-zone a.ob-ref:hover { color: var(--focus); }
  .offboard-zone .ob-title { color: var(--ink-mid); }
  .offboard-zone .ob-why { margin-top: 3px; color: var(--ink-dim); font: 10px var(--mono); }
  .offboard-zone .ob-fix { margin-top: 2px; color: var(--done); font-size: 10.5px; }
  header .num .ob-count { color: var(--done); }
  /* Auto-dispatch (decision 16): what the board sends to free lanes, or would. */
  .dispatch-zone { display: none; margin-bottom: 13px; padding: 7px 10px 8px; border: 1px solid var(--line-soft); border-radius: 9px; background: rgba(8, 13, 19, .35); }
  .dispatch-zone.on { display: block; }
  .dispatch-zone > h2 { margin: 0 0 6px; font-size: 10px; line-height: 1.35; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); cursor: pointer; }
  .dispatch-zone > h2 b { color: var(--ink-mid); }
  .dispatch-zone > h2 .caret { margin-right: 6px; transform: rotate(90deg); }
  .dispatch-zone.collapsed > h2 { margin-bottom: 0; }
  .dispatch-zone.collapsed > h2 .caret { transform: none; }
  .dispatch-zone.collapsed .dz-row { display: none; }
  .dispatch-zone .dz-row { font: 11px var(--mono); line-height: 1.5; color: var(--ink-mid); overflow-wrap: anywhere; }
  .dispatch-zone .dz-state { color: var(--ink-dim); }
  .dispatch-zone .dz-state.sent { color: var(--done); }
  .dispatch-zone .dz-state.bad { color: #e0806a; }

  /* Journal: the board process's timestamped log, newest line first. */
  .journal-zone { margin-bottom: 13px; padding: 7px 10px 8px; border: 1px solid var(--line-soft); border-radius: 9px; background: rgba(8, 13, 19, .35); }
  .journal-zone > h2 { margin: 0 0 7px; font-size: 10px; line-height: 1.35; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); cursor: pointer; }
  .journal-zone > h2 b { color: var(--ink-mid); }
  .journal-zone > h2 .caret { margin-right: 6px; transform: rotate(90deg); }
  .journal-zone.collapsed > h2 { margin-bottom: 0; }
  .journal-zone.collapsed > h2 .caret { transform: none; }
  .journal-zone.collapsed .journal-body { display: none; }
  .journal-filters { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 7px; }
  .journal-chip { padding: 2px 7px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel-low); color: var(--ink-dim); cursor: pointer; font: 700 9px/1.3 var(--mono); text-transform: lowercase; }
  .journal-chip:hover, .journal-chip.on { border-color: #31556a; color: var(--focus); background: rgba(8, 22, 30, .72); }
  .journal-lines { max-height: 300px; overflow: auto; border-top: 1px solid var(--line-soft); }
  .journal-line { padding: 3px 1px; border-bottom: 1px solid rgba(37, 52, 69, .45); color: var(--ink-mid); font: 10.5px/1.45 var(--mono); overflow-wrap: anywhere; white-space: pre-wrap; }
  .journal-empty { padding: 7px 1px 2px; color: var(--ink-dim); font: 10px var(--mono); }

  /* One column per stage on the road — the page sets --pcols from ROAD, so a
     stage that leaves the road (acceptance, 29.08) leaves no empty column. */
  .pboard { display: grid; gap: 9px; align-items: start;
            grid-template-columns: repeat(var(--pcols, 7), minmax(0, 1fr)); }
  .pcol { min-width: 0; overflow-wrap: anywhere; }
  .pcol > h2 {
    display: flex; align-items: center; gap: 5px;
    margin: 0 0 7px; padding: 5px 6px 6px; min-width: 0;
    font-size: 10px; line-height: 1.2; letter-spacing: .11em; text-transform: uppercase;
    color: var(--ink-mid); border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(23, 36, 51, .26), transparent);
  }
  .pcol > h2 span {
    flex: 0 0 auto; margin-left: auto; padding: 0 5px; border: 1px solid var(--line-soft);
    border-radius: 8px; color: var(--ink-dim); background: var(--panel-low);
    font-family: var(--mono); font-size: 9px; letter-spacing: 0;
  }
  /* Average time a card spends in the column — where the sprint's hours go. */
  .pcol > h2 em.col-avg {
    flex: 0 1 auto; min-width: 0; font-style: normal; font-family: var(--mono);
    font-size: 9px; letter-spacing: 0; text-transform: none; color: var(--ink-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pcol.done > h2 { color: var(--working); border-color: #1f6a52; }
  .pcol.merged > h2 { color: var(--working); border-color: #1f6a52; }

  .pcard {
    --stage: var(--violet);
    --stage-rgb: 185, 156, 255;
    position: relative; isolation: isolate; min-width: 0; max-width: 100%; overflow: hidden;
    margin-bottom: 9px; padding: 0; cursor: pointer;
    border: 1px solid var(--line); border-left: 4px solid var(--stage); border-radius: 9px;
    background:
      radial-gradient(circle at 0 0, rgba(var(--stage-rgb), .075), transparent 42%),
      linear-gradient(145deg, var(--panel-lift), var(--panel) 52%, #0f1924);
    box-shadow: 0 7px 18px var(--shadow-deep), inset 0 1px rgba(255, 255, 255, .035);
    transition: transform 120ms ease, border-color 120ms ease, box-shadow 120ms ease, background 120ms ease;
  }
  .pcard::after {
    content: ""; position: absolute; z-index: -1; inset: 0 0 auto; height: 1px;
    background: linear-gradient(90deg, rgba(var(--stage-rgb), .5), rgba(255, 255, 255, .12), transparent 72%);
    pointer-events: none;
  }
  .pcard:hover {
    transform: translateY(-1px); border-color: var(--line-hot); border-left-color: var(--stage);
    background:
      radial-gradient(circle at 0 0, rgba(var(--stage-rgb), .11), transparent 45%),
      linear-gradient(145deg, #1a293a, var(--panel-hi) 55%, #111d29);
    box-shadow: 0 10px 25px rgba(0, 0, 0, .42), inset 0 1px rgba(255, 255, 255, .05);
  }
  .pcard.open {
    cursor: default; border-color: #35495e; border-left-color: var(--stage);
    box-shadow: 0 13px 32px rgba(0, 0, 0, .46), 0 0 0 1px rgba(var(--stage-rgb), .045);
  }
  .pcard.st-done { --stage: var(--working); --stage-rgb: 53, 214, 160; }
  .pcard.st-stuck { --stage: var(--blocked); --stage-rgb: 255, 92, 95; }
  .pcard .top {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 6px;
    min-width: 0; padding: 9px 9px 4px 10px;
  }
  .pcard .nm {
    min-width: 0; overflow-wrap: anywhere;
    color: var(--ink); font-weight: 750; font-size: 11px; line-height: 1.3; letter-spacing: -.005em;
  }
  .pcard .nm[data-window] { cursor: pointer; }
  .pcard .nm[data-window]:hover { color: var(--focus); text-decoration: underline; }
  .pcard .fold-mark {
    position: relative; flex: 0 0 auto; width: 17px; height: 17px; margin-top: -1px;
    border: 1px solid var(--line); border-radius: 50%; background: rgba(8, 13, 19, .55);
  }
  .pcard .fold-mark::before {
    content: ""; position: absolute; left: 5px; top: 4px; width: 4px; height: 4px;
    border-right: 1.5px solid var(--ink-dim); border-bottom: 1.5px solid var(--ink-dim);
    transform: rotate(45deg); transition: transform 120ms ease, top 120ms ease;
  }
  .pcard.open .fold-mark::before { top: 6px; transform: rotate(225deg); }
  .pcard .scanline {
    display: flex; align-items: center; gap: 5px; min-width: 0;
    padding: 0 9px 8px 10px;
  }
  .pcard .stage-badge {
    flex: 0 0 auto; max-width: 48%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 2px 6px; border: 1px solid rgba(var(--stage-rgb), .38); border-radius: 9px;
    background: rgba(var(--stage-rgb), .09); color: var(--stage);
    font-family: var(--mono); font-size: 9px; font-weight: 700; line-height: 1.2;
    letter-spacing: .055em; text-transform: uppercase;
  }
  .pcard .card-id {
    flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--ink-dim); font-family: var(--mono); font-size: 9px;
  }
  .pcard .total-clock {
    display: inline-flex; flex: 0 0 auto; align-items: baseline; gap: 3px; margin-left: auto;
    padding: 2px 5px; border: 1px solid #24475a; border-radius: 8px;
    background: rgba(8, 22, 30, .72); color: var(--focus); white-space: nowrap;
  }
  .pcard .clock-label {
    color: var(--ink-dim); font-family: var(--ui); font-size: 8px; letter-spacing: .06em; text-transform: uppercase;
  }
  /* The clock ticks in the browser: the board sends the stage history, the page
     counts. A card's clock must move without a request per second. */
  .pcard .clk { font-family: var(--mono); font-size: 10px; font-weight: 650; color: var(--focus); }
  .pcard .clk.stopped { color: var(--ink-dim); }
  .pcard .signals {
    display: grid; gap: 4px; min-width: 0; padding: 0 9px 7px 10px;
  }
  .pcard .row {
    min-width: 0; margin: 0; overflow-wrap: anywhere;
    font-size: 11.5px; line-height: 1.35; color: var(--ink-mid);
  }
  .pcard .row.mono { font-family: var(--mono); font-size: 10px; color: var(--ink-dim); }
  .pcard .callout {
    position: relative; padding: 4px 6px 4px 17px; border: 1px solid var(--line-soft); border-radius: 5px;
    background: rgba(8, 13, 19, .45); color: var(--ink-mid);
  }
  .pcard .callout::before {
    content: ""; position: absolute; left: 7px; top: 8px; width: 4px; height: 4px;
    border-radius: 50%; background: var(--done); box-shadow: 0 0 8px rgba(255, 180, 74, .45);
  }
  .pcard .status {
    position: relative; padding: 4px 6px 4px 17px; border: 1px solid var(--line-soft); border-radius: 5px;
    background: rgba(8, 13, 19, .42);
  }
  .pcard:not(.open) .status .status-text {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .pcard .status::before {
    content: ""; position: absolute; left: 7px; top: 8px; width: 4px; height: 4px;
    border-radius: 50%; background: var(--ink-dim);
  }
  .pcard .artifact-row { padding: 0 8px 7px 9px; }
  .pcard .artifact-bell {
    display: flex; align-items: center; gap: 6px; width: 100%; min-width: 0; padding: 7px 8px;
    border: 1px solid #825f24; border-radius: 6px;
    background:
      linear-gradient(90deg, rgba(255, 180, 74, .18), rgba(255, 180, 74, .065)),
      var(--panel-low);
    color: #ffd08a; font-size: 11px; font-weight: 750; line-height: 1.25; text-decoration: none;
    box-shadow: inset 0 1px rgba(255, 224, 174, .08), 0 0 16px rgba(255, 180, 74, .055);
  }
  .pcard .artifact-bell:hover { border-color: var(--done); color: #ffe0aa; }
  .pcard .artifact-bell.answered {
    border-color: #2a6b52; color: #9ff0cf; box-shadow: none;
    background:
      linear-gradient(90deg, rgba(53, 214, 160, .16), rgba(53, 214, 160, .05)),
      var(--panel-low);
  }
  .pcard .artifact-bell.answered:hover { border-color: var(--working); color: #c8fbe6; }
  .pcard .bell-icon { flex: 0 0 auto; font-size: 13px; filter: saturate(.9); }
  .pcard .bell-copy { min-width: 0; overflow-wrap: anywhere; }
  .pcard .chip-row {
    display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; padding: 0 8px 7px 9px;
  }
  .pcard .meta-chip {
    display: inline-flex; align-items: center; gap: 4px; min-width: 0; max-width: 100%; padding: 3px 6px;
    border: 1px solid var(--line); border-radius: 9px; background: rgba(8, 13, 19, .52);
    color: var(--ink-mid); font-family: var(--mono); font-size: 9.5px; line-height: 1.15;
    text-decoration: none;
  }
  .pcard a.meta-chip:hover { border-color: #37657a; color: var(--focus); background: rgba(18, 38, 49, .74); }
  .pcard .chip-key {
    flex: 0 0 auto; color: var(--ink-dim); font-family: var(--ui); font-size: 8px;
    font-weight: 700; letter-spacing: .065em; text-transform: uppercase;
  }
  .pcard .chip-value { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pcard .pr-chip { border-color: #4a3a70; color: var(--violet); }
  .pcard .pr-chip.ci-green { border-color: #1f6a52; color: var(--working); }
  .pcard .pr-chip.ci-red { border-color: #6a2224; color: var(--blocked); }
  .pcard .pr-chip.ci-run { border-color: #6a5122; color: var(--done); }
  .pcard .lane-chip.busy { border-color: #1f5f7a; color: var(--focus); }
  .pcard .lane-chip.idle { border-color: #5a4a1f; color: var(--done); }
  .pcard .lane-chip.none { border-color: var(--line); color: var(--ink-dim); }
  .pcard .lane-chip.none .chip-key { opacity: 1; }
  .pcard .lane-chip .chip-key { color: inherit; opacity: .75; }
  /* What the unit waits for: its ticket's "depends on" resolved against the
     sprint — green once merged, amber while open, grey outside the sprint. */
  .pcard .deps-row { padding-top: 0; align-items: center; }
  .pcard .deps-label {
    flex: 0 0 auto; color: var(--ink-dim); font-family: var(--ui); font-size: 8px;
    font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  }
  .pcard .dep-chip.met { border-color: #1f6a52; color: var(--working); }
  .pcard .dep-chip.open { border-color: #5a4a1f; color: var(--done); }
  .pcard .dep-chip.outside { border-color: var(--line); color: var(--ink-dim); }
  .pcard .dep-chip .chip-key { color: inherit; opacity: .8; }
  .pcard .sprint-wrap { min-width: 0; overflow-x: auto; }
  .pcard .sprint-table {
    width: 100%; min-width: 0; border-collapse: collapse; font-family: var(--mono); font-size: 10px; line-height: 1.3;
  }
  .pcard .sprint-table th {
    padding: 2px 5px 4px; text-align: left; color: var(--ink-dim); font-family: var(--ui); font-size: 8px;
    font-weight: 700; letter-spacing: .065em; text-transform: uppercase; border-bottom: 1px solid var(--line);
  }
  .pcard .sprint-table td {
    padding: 3px 5px; vertical-align: top; border-bottom: 1px solid var(--line-soft); color: var(--ink-mid);
    overflow-wrap: anywhere;
  }
  .pcard .sprint-table td.unit { white-space: nowrap; color: var(--ink); font-weight: 700; }
  .pcard .sprint-table a { color: inherit; text-decoration: none; border-bottom: 1px dotted currentColor; }
  .pcard .sprint-table a:hover { color: var(--focus); }
  .pcard .sprint-table .st-merged, .pcard .row.st-merged { color: var(--working); }
  .pcard .sprint-table .st-pr, .pcard .row.st-pr-open { color: var(--violet); }
  .pcard .sprint-table .st-pr-green, .pcard .row.st-pr-green,
  .pcard .sprint-table .st-accepted, .pcard .row.st-accepted { color: var(--working); }
  .pcard .sprint-table .st-pr-red, .pcard .row.st-pr-red { color: var(--blocked); }
  .pcard .sprint-table .st-on-lane, .pcard .row.st-on-lane { color: var(--focus); }
  .pcard .sprint-table .st-lane-idle, .pcard .row.st-lane-idle,
  .pcard .sprint-table .st-local-check, .pcard .row.st-local-check { color: var(--done); }
  .pcard .sprint-table .st-queued, .pcard .sprint-table .st-closed,
  .pcard .row.st-queued, .pcard .row.st-closed { color: var(--ink-dim); }
  .pcard .sprint-foot { margin-top: 6px; color: var(--ink-dim); font-family: var(--ui); font-size: 9.5px; line-height: 1.4; }
  /* A sprint and its unit cards share one colour stripe, so the family is
     visible across the columns. */
  .pcard.sprint, .pcard.unit { border-left: 3px solid var(--sprint, var(--line-hot)); }
  .pcard .unit-parent {
    border-color: var(--sprint, var(--line-hot)); color: var(--ink-mid);
    background: linear-gradient(90deg, rgba(120, 221, 255, .08), transparent);
  }
  .pcard .unit-parent .chip-key { color: var(--sprint, var(--ink-dim)); }
  .pcard .row.unit-state { padding: 0 8px 6px 9px; font-family: var(--mono); font-size: 10px; }
  /* The live review badge: a reader is on the PR head right now. */
  .pcard .spec {
    min-width: 0; margin: 0; color: #bdcad6; font-size: 11.5px; line-height: 1.48;
    overflow-wrap: anywhere; white-space: pre-wrap;
  }
  .pcard .open-only { display: none; }
  .pcard.open .open-only { display: block; }
  .pcard .card-section {
    min-width: 0; margin: 0 8px 8px 9px; padding: 8px;
    border: 1px solid var(--line-soft); border-radius: 7px;
    background: linear-gradient(145deg, rgba(8, 13, 19, .72), rgba(12, 21, 30, .6));
    box-shadow: inset 0 1px rgba(255, 255, 255, .025);
  }
  .pcard .summary-section { border-left: 2px solid var(--line-hot); }
  .pcard h3 {
    margin: 0 0 6px; font-size: 9px; font-weight: 750; letter-spacing: .13em; text-transform: uppercase;
    color: var(--ink-dim);
  }
  .pcard .spec-jump { margin-top: 7px; }
  .pcard .stage-times {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(min(92px, 100%), 1fr)); gap: 4px;
    min-width: 0;
  }
  .pcard .stage-time {
    display: flex; align-items: baseline; justify-content: space-between; gap: 5px; min-width: 0;
    padding: 4px 5px; border: 1px solid var(--line-soft); border-radius: 5px;
    background: rgba(17, 27, 38, .72);
  }
  .pcard .stage-name {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--ink-mid); font-size: 9.5px;
  }
  .pcard .stage-time .clk { flex: 0 0 auto; font-size: 9.5px; }
  .pcard .off-clock {
    display: block; margin-top: 6px; color: var(--done); font-size: 9.5px; line-height: 1.35;
  }
  .pcard .cmt {
    min-width: 0; margin-top: 5px; padding: 6px 7px; border: 1px solid var(--line-soft);
    border-left: 2px solid #33485c; border-radius: 0 5px 5px 0;
    background: rgba(8, 13, 19, .58); font-size: 11.5px; color: var(--ink-mid);
    overflow-wrap: anywhere; white-space: pre-wrap;
  }
  .pcard .cmt:first-child { margin-top: 0; }
  .pcard .comment-meta { display: flex; align-items: baseline; gap: 5px; margin-bottom: 3px; white-space: normal; }
  .pcard .cmt b { color: var(--ink); font-weight: 600; }
  .pcard .cmt .when { margin-left: auto; font-family: var(--mono); font-size: 9px; color: var(--ink-dim); }
  .pcard .comment-body { white-space: pre-wrap; }
  .pcard .acts { display: flex; flex-wrap: wrap; gap: 5px; margin: 0; }
  .pcard .acts:empty { display: none; }
  .pcard .acts .hbtn { flex: 1 1 auto; min-width: 0; padding: 3px 7px; border-radius: 8px; }
  .pcard .acts .hbtn.go { color: var(--working); border-color: #1f6a52; }
  .pcard .acts .hbtn.bad { color: var(--blocked); border-color: #6a2224; }
  .pcard form { display: flex; flex-wrap: wrap; gap: 5px; min-width: 0; margin-top: 7px; }
  .pcard input, .pcard select {
    max-width: 100%; min-width: 0; font-family: var(--ui); font-size: 11px; padding: 4px 6px;
    background: var(--panel-low); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px;
  }
  .pcard input:focus, .pcard select:focus {
    outline: none; border-color: var(--focus); box-shadow: 0 0 0 2px rgba(120, 221, 255, .09);
  }
  .pcard input.author { flex: 0 1 84px; }
  .pcard input.text { flex: 1 1 105px; }
  .pcard form .hbtn { flex: 0 0 auto; padding: 3px 8px; }
  .pcard .counter-row {
    display: flex; flex-wrap: wrap; gap: 4px 8px; min-width: 0; padding: 6px 9px 7px 10px;
    border-top: 1px solid rgba(37, 52, 69, .72); background: rgba(8, 13, 19, .22);
  }
  .pcard .counter-item { display: inline-flex; align-items: baseline; gap: 5px; min-width: 0; }
  .pcard .counter-label {
    color: var(--ink-dim); font-size: 8px; font-weight: 700; letter-spacing: .075em; text-transform: uppercase;
  }
  .pcard .cnt { min-width: 0; font-family: var(--mono); font-size: 9.5px; color: var(--ink-dim); }
  .pcard .cnt b { color: var(--blocked); }
  .pcard .review-counter .cnt b { color: var(--violet); }
  .pcard .status .age { font-family: var(--mono); font-size: 10px; color: var(--ink-dim); }
  .pcard a.spec-link {
    display: inline-flex; max-width: 100%; padding: 2px 6px; border: 1px solid #285266; border-radius: 8px;
    color: var(--focus); font-family: var(--mono); font-size: 9.5px; text-decoration: none;
  }
  .pcard a.spec-link:hover { border-color: var(--focus); background: rgba(120, 221, 255, .055); }
  .pcard .card-footer {
    padding: 0 8px 8px 9px;
  }

  @media (max-width: 1180px) {
    .pboard { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media (max-width: 900px) {
    .sprint-band .sprint-panel { grid-template-columns: minmax(0, 1fr); }
    .sprint-band .sprint-summary { border-right: 0; border-bottom: 1px solid var(--line); }
  }
  @media (max-width: 680px) {
    .pipeline { padding: 8px 9px 16px; }
    .pboard { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .sprint-band .flight-table, .sprint-band .flight-table tbody,
    .sprint-band .flight-table tr, .sprint-band .flight-table td { display: block; width: 100%; }
    .sprint-band .flight-table thead { display: none; }
    .sprint-band .flight-table tr { padding: 6px 0; border-bottom: 1px solid var(--line); }
    .sprint-band .flight-table td {
      display: grid; grid-template-columns: 65px minmax(0, 1fr); padding: 3px 6px; border: 0;
    }
    .sprint-band .flight-table td::before {
      content: attr(data-label); color: var(--ink-dim); font: 700 8px var(--ui);
      letter-spacing: .08em; text-transform: uppercase;
    }
  }
  @media (max-width: 390px) {
    .pboard { grid-template-columns: minmax(0, 1fr); }
  }

</style>
</head>
<body>
<header>
  <h1>Watchtower <span class="proj" id="project"></span></h1>
  <div class="num" id="pipe-counts"></div>
  <div class="flag" id="board-warn" hidden></div>
  <div class="swept" id="swept">swept never</div>
  <span class="spacer"></span>
  <button class="hbtn plus" id="pipe-add-toggle" title="add a pipeline card">+ Card</button>
  <button class="hbtn gear" id="settings-toggle" title="settings: the project whose windows feed the facts">⚙</button>
</header>
<!-- "+ Card": a card is born at the Spec stage with a title and, if you already
     have them, the spec text and a short summary. Everything else is filled in
     as it moves. The bar lives outside the board redraw: the board refreshes
     every three seconds and typed text must not disappear under your hands. -->
<div class="handbar" id="pipebar">
  <form id="pipe-form" autocomplete="off">
    <input class="t" id="pipe-title" placeholder="title (required)" maxlength="200">
    <input class="txt" id="pipe-spec" placeholder="spec (optional)" maxlength="20000">
    <input class="txt" id="pipe-summary" placeholder="summary (optional, short)" maxlength="200">
    <button class="hbtn" type="submit">add card</button>
    <span class="note" id="pipe-note"></span>
  </form>
</div>
<div class="pipeline" id="pipeline">
  <!-- Stuck is not a column of the road: it is a card that failed three times in
       a row and now waits for a human. It sits above everything, in red. -->
  <div class="sprint-band" id="sprint-band"></div>
  <div class="stuck-zone" id="stuck-zone"></div>
  <div class="offboard-zone" id="offboard-zone"></div>
  <div class="dispatch-zone" id="dispatch-zone"></div>
  <div class="journal-zone collapsed" id="journal-zone"></div>
  <div class="pboard" id="pboard"></div>
</div>

<!-- The gear: the project whose herdr windows feed the facts and window names
     on cards. The pipeline itself needs no project. -->
<div class="sheet" id="settings">
  <div class="box" style="position: relative">
    <button class="hbtn close" id="settings-close">close</button>
    <h2>Settings</h2>
    <h3>Project</h3>
    <div class="plist" id="settings-list"></div>
    <p class="note" id="settings-note"></p>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

let pageVersion = null;
let lastData = null;

function esc(s) {
  return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

// How long ago something happened, in plain words: "just now", "5m ago".
function ago(iso) {
  const d = dur(iso);
  return d ? (d === 'just now' ? d : d + ' ago') : '';
}

// A bare duration: "5m", "3h 20m", "2d 4h".
function dur(iso) {
  if (!iso) return '';
  const ms = Date.now() - Date.parse(iso);
  if (!Number.isFinite(ms) || ms < 0) return '';
  const m = Math.floor(ms / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + 'm';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ' + (m % 60) + 'm';
  return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
}

// /data still comes every three seconds: it carries the page version (a new
// build reloads the page), the project name, the header warnings and the
// settings sheet's project list. The windows it describes are not drawn.
function render(d) {
  if (pageVersion === null) pageVersion = d.pageVersion;
  else if (d.pageVersion && d.pageVersion !== pageVersion) { location.reload(); return; }
  lastData = d;
  $('project').textContent = d.project ?? '';
  const warn = d.probeStale || '';
  $('board-warn').textContent = warn;
  $('board-warn').hidden = !warn;
  if ($('settings').classList.contains('open')) renderSettings(d);
}

// --------------------------------- project choice

function post(path, body) {
  return fetch(path, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  }).then(r => r.json()).catch(() => ({ error: 'the board did not answer' }));
}

function showError(text) {
  let div = document.querySelector('.err');
  if (!div) {
    div = document.createElement('div');
    div.className = 'err';
    document.body.insertBefore(div, $('pipeline'));
  }
  div.textContent = text;
}

// The project list in the settings sheet.
function renderProjects(box, projects, current) {
  const rows = (projects ?? []).map(p =>
    '<button data-project="' + esc(p.project) + '"' + (p.project === current ? ' class="cur"' : '') + '>'
    + '<span>' + esc(p.project) + '</span>'
    + '<span class="meta">' + p.windows + ' window' + (p.windows === 1 ? '' : 's')
    + (p.agents ? ' · ' + p.agents + ' with an agent' : '') + '</span></button>');
  rows.push('<button data-all="1"' + (current === 'All windows' ? ' class="cur"' : '') + '>'
    + '<span>All windows</span><span class="meta">no project filter</span></button>');
  box.innerHTML = rows.join('');
  for (const b of box.querySelectorAll('button')) {
    b.onclick = async () => {
      const note = $('settings-note');
      note.textContent = 'saving…';
      const r = b.dataset.all
        ? await post('/project/select', { all: true })
        : await post('/project/select', { project: b.dataset.project });
      if (r && r.error) { note.textContent = r.error; return; }
      note.textContent = 'watching: ' + (r.project ?? '');
      $('settings').classList.remove('open');
      $('settings-toggle').classList.remove('on');
      poll();
    };
  }
}

function renderSettings(d) {
  renderProjects($('settings-list'), d.projects ?? [], d.project ?? null);
}

$('settings-toggle').onclick = () => {
  const open = $('settings').classList.toggle('open');
  $('settings-toggle').classList.toggle('on', open);
  if (open && lastData) renderSettings(lastData);
};
$('settings-close').onclick = () => {
  $('settings').classList.remove('open');
  $('settings-toggle').classList.remove('on');
};

// ------------------------------------------------------- the pipeline view
//
// A Card here is not a Window: it lives in the board's own state and moves
// through stages. The page draws it, ticks its clocks and sends every change
// to a validated endpoint — it decides nothing itself.

// The road, and the one move allowed off each stage. The server holds the same
// map and is the one that enforces it; this copy only decides which button to
// draw, so a wrong click is impossible rather than merely refused.
const NEXT_STAGE = {
  spec: 'grilled',
  grilled: 'ticketed',
  ticketed: 'development',
  development: 'local_check',
  local_check: 'ci_pr',
  ci_pr: 'merged',
  merged: 'done',
};
// The stages a failure can be reported from — the ones where work is actually
// run. The same list as in pipeline.mjs, which is what refuses the rest.
const CAN_FAIL = ['development', 'local_check', 'ci_pr'];
// Done is the end of the road: it does not add to the card's delivery clock.
const OFF_THE_CLOCK = new Set(['done']);
const STAGE_TITLE = {
  spec: 'Spec', grilled: 'Grill', ticketed: 'Ticketed', development: 'Development',
  local_check: 'Local check', ci_pr: 'CI/PR + review', merged: 'Merged', done: 'Done', stuck: 'Stuck',
};
// The columns. The two paper stages before the tickets are one column, Grill
// (owner, 29.08: "remove the Spec column"): a card is born there with its spec
// and leaves it ticketed; the grill's GO is the move between the two stages
// the server still keeps, and the card's chip says which one it is on.
const ROAD = ['grilled', 'ticketed', 'development', 'local_check', 'ci_pr', 'merged', 'done'];
const COLUMN_STAGES = { grilled: ['spec', 'grilled'] };
const columnOf = stage => (stage === 'spec' ? 'grilled' : stage);
const ATTACH_FIELDS = ['ticket', 'branch', 'pr', 'artifact', 'lane', 'subscription', 'slot', 'window'];
const LINK_FIELDS = ['ticket', 'branch', 'pr', 'artifact'];

let pipeSeen = '';
let pipeTimer = null;
let lastPipe = null;
const openCards = new Set();
// What the owner unfolded in this browser: sprints by id, the off-board zone,
// the auto-dispatch and journal zones. Absent = folded (the default, owner 29.08).
let folds = { sprints: {}, offboard: true, dispatch: true, journal: true };
try {
  const saved = JSON.parse(localStorage.getItem('watchtower-folds') || 'null');
  if (saved && typeof saved === 'object') folds = {
    sprints: saved.sprints || {},
    offboard: saved.offboard !== false,
    dispatch: saved.dispatch !== false,
    journal: saved.journal !== false,
  };
} catch (e) {}
function saveFolds() { try { localStorage.setItem('watchtower-folds', JSON.stringify(folds)); } catch (e) {} }
function isSprintFolded(id) { return folds.sprints[id] !== false; }
function toggleSprintFold(id) { folds.sprints[id] = isSprintFolded(id) ? false : true; saveFolds(); if (lastPipe) renderPipeline(lastPipe); }
function toggleOffBoardFold() { folds.offboard = !folds.offboard; saveFolds(); if (lastPipe) renderPipeline(lastPipe); }
function toggleDispatchFold() { folds.dispatch = !folds.dispatch; saveFolds(); if (lastPipe) renderPipeline(lastPipe); }
function toggleJournalFold() { folds.journal = !folds.journal; saveFolds(); renderJournal(); }

const JOURNAL_FILTERS = { all: '', merge: 'merge', alarm: 'alarm', dispatch: 'dispatch', errors: 'error' };
const JOURNAL_TIMEOUT_MS = 2500;
let journalFilter = 'all';
let journalLines = [];
let journalError = '';
let journalSeen = '';
let journalRequestId = 0;
let journalController = null;

function renderJournal() {
  const seen = JSON.stringify([folds.journal, journalFilter, journalLines, journalError]);
  if (seen === journalSeen) return;
  journalSeen = seen;
  const zone = $('journal-zone');
  zone.classList.toggle('collapsed', folds.journal);
  const rows = journalError
    ? '<div class="journal-empty">' + esc(journalError) + '</div>'
    : (journalLines.length
      ? journalLines.map(line => '<div class="journal-line">' + esc(line) + '</div>').join('')
      : '<div class="journal-empty">no matching lines</div>');
  zone.innerHTML = '<h2 data-journal-toggle="1" title="' + (folds.journal ? 'open the journal' : 'fold the journal') + '"><span class="caret"></span>Journal · <b>'
    + journalLines.length + '</b> line' + (journalLines.length === 1 ? '' : 's') + ' · newest first</h2>'
    + '<div class="journal-body"><div class="journal-filters">'
    + Object.keys(JOURNAL_FILTERS).map(key => '<button type="button" class="journal-chip' + (key === journalFilter ? ' on' : '')
      + '" data-journal-filter="' + key + '">' + key + '</button>').join('')
    + '</div><div class="journal-lines">' + rows + '</div></div>';
  zone.querySelector('[data-journal-toggle]').onclick = toggleJournalFold;
  for (const chip of zone.querySelectorAll('[data-journal-filter]')) {
    chip.onclick = () => {
      journalFilter = chip.dataset.journalFilter;
      journalSeen = '';
      refreshJournal();
    };
  }
}

async function refreshJournal() {
  const requestId = ++journalRequestId;
  if (journalController) journalController.abort();
  const controller = new AbortController();
  journalController = controller;
  const timeout = setTimeout(() => controller.abort(new Error('request timed out')), JOURNAL_TIMEOUT_MS);
  try {
    const word = JOURNAL_FILTERS[journalFilter] || '';
    const path = '/api/log?lines=200' + (word ? '&filter=' + encodeURIComponent(word) : '');
    const response = await fetch(path, { cache: 'no-store', signal: controller.signal });
    const data = await response.json();
    if (!response.ok || data.error) throw new Error(data.error || 'request failed');
    if (requestId !== journalRequestId) return;
    journalLines = Array.isArray(data.lines) ? data.lines : [];
    journalError = '';
  } catch (e) {
    if (requestId !== journalRequestId) return;
    journalError = 'the journal did not answer: ' + (e && e.message ? e.message : e);
  } finally {
    clearTimeout(timeout);
    if (journalController === controller) journalController = null;
    if (requestId === journalRequestId) renderJournal();
  }
}
// Each sprint owns its table order. Refreshes rebuild the band, so sorting
// lives outside the DOM and survives the three-second redraw cycle.
const sprintBandSort = new Map();
// Whether this board runs the subscription/Telegram flow. Only then does a
// grilled card wait for a subscription (and lose its plain forward button);
// a board without the feature keeps its plain grilled -> Ticketed button.
// The server decides this in /pipeline/data; default off so a board that never
// sends looks exactly as it did before this wave.
let usesSubscriptions = false;
// A duration in plain words — the same words the agent endpoint uses.
function fmtDur(ms) {
  if (!Number.isFinite(ms) || ms < 0) return '-';
  const m = Math.floor(ms / 60000);
  if (m < 1) return '<1m';
  if (m < 60) return m + 'm';
  const h = Math.floor(m / 60);
  if (h < 24) return h + 'h ' + (m % 60) + 'm';
  return Math.floor(h / 24) + 'd ' + (h % 24) + 'h';
}

// How long a card spends in one column: every visit any card on the board
// ever paid to that stage, a visit still open counted up to now. The average
// says where a sprint's hours actually go — a column that is full is not the
// same as a column that is slow.
function stageDwell(cards, keys, now) {
  const spans = [];
  let open = 0;
  const wanted = new Set(Array.isArray(keys) ? keys : [keys]);
  for (const c of cards) {
    for (const seg of (Array.isArray(c.stageHistory) ? c.stageHistory : [])) {
      if (!wanted.has(seg.stage)) continue;
      const from = Date.parse(seg.enteredAt);
      const to = seg.leftAt ? Date.parse(seg.leftAt) : now;
      if (!Number.isFinite(from) || !Number.isFinite(to) || to <= from) continue;
      if (!seg.leftAt) open++;
      spans.push(to - from);
    }
  }
  if (!spans.length) return null;
  return { n: spans.length, open, avg: spans.reduce((a, b) => a + b, 0) / spans.length, max: Math.max(...spans) };
}

// How long a review round takes: every round filed on a card (`reviews`) and
// the ones running now, counted up to now. Shown on the CI/PR column.
function reviewDwell(cards, now) {
  const spans = [];
  for (const c of cards) {
    for (const r of (Array.isArray(c.reviews) ? c.reviews : [])) {
      const a = Date.parse(r.since), b = Date.parse(r.until);
      if (Number.isFinite(a) && Number.isFinite(b) && b > a) spans.push(b - a);
    }
    if (c.review && c.review.running && c.review.since) {
      const a = Date.parse(c.review.since);
      if (Number.isFinite(a) && now > a) spans.push(now - a);
    }
  }
  if (!spans.length) return null;
  return { n: spans.length, avg: spans.reduce((a, b) => a + b, 0) / spans.length };
}

// A clock is drawn as "what has already been counted" plus "since when it is
// still running". Ticking is then a subtraction the page does once a second,
// with no request behind it.
function clockSpan(cls, baseMs, fromMs) {
  return '<span class="' + cls + (fromMs ? '' : ' stopped') + '"'
    + ' data-base="' + Math.round(baseMs) + '"'
    + ' data-from="' + (fromMs || '') + '">' + esc(fmtDur(baseMs + (fromMs ? Date.now() - fromMs : 0)))
    + '</span>';
}

function tickClocks() {
  const now = Date.now();
  for (const el of document.querySelectorAll('#pipeline .clk')) {
    const base = Number(el.dataset.base) || 0;
    const from = Number(el.dataset.from) || 0;
    el.textContent = fmtDur(base + (from ? now - from : 0));
  }
}
setInterval(tickClocks, 1000);

// Every clock of one card, all of them out of stageHistory: what is closed is
// added up, what is still open is handed to the ticker as a starting point.
function calcClocks(c) {
  const byStage = {};
  let total = 0;
  let totalFrom = 0;
  for (const h of c.stageHistory ?? []) {
    const from = Date.parse(h.enteredAt);
    if (!Number.isFinite(from)) continue;
    const slot = byStage[h.stage] ?? (byStage[h.stage] = { base: 0, from: 0 });
    if (h.leftAt) {
      const ms = Math.max(0, Date.parse(h.leftAt) - from);
      slot.base += ms;
      if (!OFF_THE_CLOCK.has(h.stage)) total += ms;
    } else {
      // The stage the card is in right now. Its own clock always runs; the
      // card's total runs only if this stage counts at all.
      slot.from = from;
      if (!OFF_THE_CLOCK.has(h.stage)) totalFrom = from;
    }
  }
  return { total, totalFrom, byStage };
}

function hasCardStatus(c) {
  const s = c.status;
  return Boolean(s && ((s.text && String(s.text).trim()) || s.at));
}

function statusLine(c) {
  if (!hasCardStatus(c)) return '';
  const age = ago(c.status.at);
  return '<div class="row status">'
    + (c.status.text ? '<span class="status-text">' + esc(c.status.text) + '</span> ' : '')
    + (age ? ' <span class="age">' + esc(age) + '</span>' : '')
    + '</div>';
}

function failLine(c) {
  const n = c.counters ?? {};
  const bits = [];
  if (n.localFails) bits.push('local <b>' + n.localFails + '</b>');
  if (n.ciFails) bits.push('CI <b>' + n.ciFails + '</b>');
  if (n.reviewFails) bits.push('review <b>' + n.reviewFails + '</b>');
  if (!bits.length) return 'no failures';
  if (c.consecutiveFails) bits.push('<b>' + c.consecutiveFails + '</b> in a row');
  return bits.join(' · ');
}

function actBtn(id, action, body, label, cls) {
  return '<button class="hbtn ' + (cls || '') + '" data-act="' + esc(action) + '"'
    + ' data-id="' + esc(id) + '" data-body="' + esc(JSON.stringify(body)) + '">' + esc(label) + '</button>';
}

// The pipeline will eventually receive the same PR detail the windows board
// already knows. Keep it in the card's link rail when it arrives, without
// drawing an empty placeholder on today's data.
// The sprint table on an opened card: one row per unit ticket — where it is
// being built, which PR carries it, and what state that adds up to.
function sprintTable(s) {
  const link = (href, text) => href
    ? '<a href="' + esc(href) + '" target="_blank" rel="noreferrer" onclick="event.stopPropagation()">' + esc(text) + '</a>'
    : esc(text);
  const rows = (s.units || []).map(u => {
    const lane = u.lane
      ? esc(u.lane.host + '/' + u.lane.lane) + (u.lane.busy ? '' : ' <span class="st-lane-idle">idle</span>')
        + (u.lane.since && u.lane.busy ? ' <span class="st-queued">' + esc(u.lane.since) + '</span>' : '')
      : '<span class="st-queued">—</span>';
    let pr = '<span class="st-queued">—</span>';
    if (u.merged) pr = link(u.merged.url, '#' + u.merged.number) + ' <span class="st-merged">merged</span>';
    else if (u.pr) {
      const ci = u.pr.ci || {};
      const cls = ci.color === 'green' ? 'st-pr-green' : ci.color === 'red' ? 'st-pr-red' : 'st-pr';
      pr = link(u.pr.url, '#' + u.pr.number) + ' <span class="' + cls + '">' + esc(ci.text || (u.pr.draft ? 'draft' : 'open')) + '</span>'
        + (u.pr.runner && u.pr.runner.name ? ' <span class="st-queued">· ' + esc(u.pr.runner.name + (u.pr.runner.host ? ' (' + u.pr.runner.host + ')' : '')) + '</span>' : '');
    }
    const stateCls = 'st-' + String(u.state || 'queued').replace(/\s+/g, '-');
    return '<tr><td class="unit">' + esc(u.unit || '—') + '</td>'
      + '<td>' + link(u.url, '#' + u.ticket) + '</td>'
      + '<td>' + lane + '</td>'
      + '<td>' + pr + '</td>'
      + '<td class="' + stateCls + '">' + esc(u.state) + '</td></tr>';
  });
  const foot = [];
  foot.push('free lanes: ' + ((s.free || []).join(', ') || 'none'));
  if (s.busyElsewhere && s.busyElsewhere.length) foot.push('busy with other work: ' + s.busyElsewhere.join(', '));
  if (s.stale && s.stale.length) foot.push('sources stale: ' + s.stale.join(', ') + ' — lane and PR facts may be old');
  return '<section class="card-section sprint-section"><h3>sprint — units, lanes, PRs</h3>'
    + (rows.length
      ? '<div class="sprint-wrap"><table class="sprint-table"><thead><tr><th>unit</th><th>ticket</th><th>lane</th><th>PR</th><th>state</th></tr></thead><tbody>'
        + rows.join('') + '</tbody></table></div>'
      : '<div class="st-queued">no unit tickets reference umbrella #' + esc(String(s.umbrella)) + ' yet</div>')
    + '<div class="sprint-foot">' + esc(foot.join(' · ')) + '</div></section>';
}

function sprintBandUnitNumber(unit) {
  const digits = String(unit || '').replace(/\D/g, '');
  const n = Number(digits);
  return digits && Number.isFinite(n) ? n : Number.MAX_SAFE_INTEGER;
}

function sprintBandStateClass(u) {
  if (u.merged) return 'st-merged';
  if (u.pr) {
    const color = u.pr.ci && u.pr.ci.color;
    if (color === 'green') return 'st-pr-green';
    if (color === 'red') return 'st-pr-red';
    return 'st-pr-open';
  }
  if (u.lane?.check || u.state === 'local check') return 'st-local-check';
  if (u.lane) return u.lane.busy ? 'st-on-lane' : 'st-lane-idle';
  return u.state === 'closed' ? 'st-closed' : 'st-queued';
}

function sprintBandCounts(s) {
  const units = s.units || [];
  const given = s.counts || {};
  const count = (key, test) => Object.prototype.hasOwnProperty.call(given, key)
    && Number.isFinite(Number(given[key])) ? Number(given[key]) : units.filter(test).length;
  return {
    units: count('units', () => true),
    queued: count('queued', u => u.state === 'queued'),
    onLane: count('onLane', u => u.state === 'on lane'),
    checking: count('checking', u => u.state === 'local check' || Boolean(u.lane?.check)),
    pr: count('pr', u => Boolean(u.pr) && !u.merged),
    merged: count('merged', u => Boolean(u.merged)),
  };
}

function sprintBandLinks(c, s) {
  const links = c.links || {};
  const stale = (s && s.stale) || [];
  const chips = [];
  for (const [key, label] of [['ticket', 'Ticket'], ['artifact', 'Artifact'], ['branch', 'Branch'], ['pr', 'PR']]) {
    const value = links[key];
    if (!String(value || '').trim()) continue;
    const content = '<b>' + label + '</b><span>' + esc(shortLink(key, value)) + '</span>';
    chips.push(/^https?:[/][/]/.test(String(value))
      ? '<a class="chip mini-link" href="' + esc(value) + '" target="_blank" rel="noreferrer">' + content + '</a>'
      : '<span class="chip mini-link" title="' + esc(value) + '">' + content + '</span>');
  }
  if ((c.subscription || '').trim()) {
    chips.push('<span class="chip mini-link"><b>Subscription</b><span>' + esc(c.subscription) + '</span></span>');
  }
  chips.push('<span class="source-health' + (stale.length ? ' stale' : '') + '">'
    + (stale.length ? 'Stale sources: ' + esc(stale.join(', ')) + ' — lane and PR facts may be old' : 'Sources current') + '</span>');
  return '<div class="links links-row">' + chips.join('') + '</div>';
}

function sprintBandProgress(s) {
  const counts = sprintBandCounts(s);
  const units = (s.units || []).slice().sort((a, b) => sprintBandUnitNumber(a.unit) - sprintBandUnitNumber(b.unit));
  const range = units.length
    ? 'ordered ' + esc(units[0].unit || '#' + units[0].ticket) + ' → ' + esc(units[units.length - 1].unit || '#' + units[units.length - 1].ticket)
    : 'waiting for unit tickets';
  const segments = units.map(u => '<i class="' + sprintBandStateClass(u) + '" title="'
    + esc((u.unit || 'unit') + ' #' + u.ticket + ' — ' + (u.state || 'queued')) + '"></i>').join('');
  return '<div class="progress-block"><div class="progress-head"><b>' + counts.units + ' unit'
    + (counts.units === 1 ? '' : 's') + '</b><span>' + range + '</span></div>'
    + '<div class="segment-bar" aria-label="Sprint unit progress">' + segments + '</div>'
    + '<div class="legend"><span><i></i>' + counts.queued + ' queued</span>'
    + '<span class="on-lane"><i></i>' + counts.onLane + ' on lane</span>'
    + '<span class="checking"><i></i>' + counts.checking + ' checking</span>'
    + '<span class="pr"><i></i>' + counts.pr + ' in PR</span>'
    + '<span class="merged"><i></i>' + counts.merged + ' merged</span></div>'
    + sprintBandQaLine(s) + '</div>';
}

// The QA tickets of a sprint (label qa on GitHub), each a link coloured by
// whether it is still open. Nothing to show while none is written.
function sprintBandQaLine(s) {
  const qa = Array.isArray(s.qaTickets) ? s.qaTickets : [];
  const uo = s.umbrellaOpen;
  // The umbrella's close is the sprint's pass declared; it is shown next to the
  // QA tickets because the sprint leaves QA on both.
  const umb = uo == null ? '' : ' · umbrella ' + (uo ? 'open' : 'closed');
  if (!qa.length) return uo == null ? '' : '<div class="qa-line' + (uo ? '' : ' clean') + '"><b>QA</b> no tickets' + umb + '</div>';
  const open = qa.filter(u => u.open && !u.merged).length;
  const links = qa.map(u => '<a class="' + (u.open && !u.merged ? 'open' : 'closed') + '" target="_blank" rel="noreferrer" href="'
    + esc(u.url || '#') + '" title="' + esc((u.title || '') + ' — ' + (u.state || '')) + '">#' + esc(String(u.ticket)) + '</a>').join(' ');
  return '<div class="qa-line' + (open || uo ? '' : ' clean') + '"><b>QA</b> ' + open + ' open of ' + qa.length + ' · ' + links + umb + '</div>';
}

// Every lane of the fleet, one row each: the FLEET.md name, the server, what
// the lane is doing and which unit of this sprint sits on it. Lanes the
// registry does not know come last, dimmed; a silent host shows in red.
function sprintBandLanes(s) {
  const table = Array.isArray(s.laneTable) ? s.laneTable : [];
  const free = s.free || [];
  const laneCount = Number(s.laneCount) || table.filter(l => l.fleet !== false).length;
  const rows = table.map(l => {
    const server = l.server || l.host || '';
    const folder = l.folder && l.folder !== l.lane ? l.host + '/' + l.folder : '';
    let state, cls;
    if (l.hostOk === false) { state = l.remembered ? 'host silent' : 'host down'; cls = 'st-pr-red'; }
    else if (l.check) { state = 'checking'; cls = 'st-local-check'; }
    else if (l.busy && l.unit) { state = 'building'; cls = 'st-on-lane'; }
    else if (l.busy) { state = 'other work'; cls = 'st-queued'; }
    else if (l.unit) { state = 'idle'; cls = 'st-lane-idle'; }
    else { state = 'free'; cls = 'st-merged'; }
    const who = l.unit
      ? '<span class="unit-cell">' + esc(l.unit + ' #' + l.ticket) + '</span>'
      : (l.busy && l.branch ? '<span class="cell-sub" title="' + esc(l.branch) + '">' + esc(l.branch) + '</span>' : '<span class="empty-note">—</span>');
    return '<tr class="' + (l.fleet === false ? 'outside' : '') + (l.hostOk === false ? ' down' : '') + '">'
      + '<td class="lane-cell" data-label="Lane">' + esc(l.lane || '?')
      + (folder ? '<span class="cell-sub" title="folder on the server today">' + esc(folder) + '</span>' : '') + '</td>'
      + '<td data-label="Server">' + esc(server) + (l.fleet === false ? '<span class="cell-sub">outside the fleet registry</span>' : '') + '</td>'
      + '<td data-label="State"><span class="state-word ' + cls + '">' + state + '</span>'
      + (l.busy && l.since ? '<span class="cell-sub">' + esc(l.since) + '</span>' : '') + '</td>'
      + '<td data-label="Unit">' + who + '</td></tr>';
  }).join('');
  return '<div class="lanes-block"><div class="lanes-head"><strong><span class="capacity-number">' + free.length
    + '</span> of ' + laneCount + ' lanes free</strong><span>names per FLEET.md · by facts</span></div>'
    + '<table class="flight-table lanes-table"><colgroup><col style="width:24%"><col style="width:34%">'
    + '<col style="width:21%"><col style="width:21%"></colgroup>'
    + '<thead><tr><th><button type="button" tabindex="-1">Lane</button></th><th><button type="button" tabindex="-1">Server</button></th>'
    + '<th><button type="button" tabindex="-1">State</button></th><th><button type="button" tabindex="-1">Unit</button></th></tr></thead><tbody>'
    + (rows || '<tr><td colspan="4"><span class="empty-note">No lanes known</span></td></tr>')
    + '</tbody></table></div>' + sprintBandCiTable(s);
}

// The CI slots as the same table: slot (FLEET.md name), server, online/busy,
// and the PR — the unit of this sprint — whose job the runner is on.
function sprintBandCiTable(s) {
  const table = Array.isArray(s.ciTable) ? s.ciTable : [];
  const ci = s.ciSlots && typeof s.ciSlots === 'object' ? s.ciSlots : null;
  const head = ci && Number(ci.total) > 0
    ? '<strong><span class="capacity-number">' + (Number(ci.busy) || 0) + '</span> of ' + (Number(ci.online) || 0) + ' online CI slots busy</strong>'
    : '<strong>CI slots</strong>';
  const note = ci && Number(ci.offline) ? Number(ci.offline) + ' offline · by facts' : 'names per FLEET.md · by facts';
  const rows = table.map(r => {
    let state, cls;
    if (!r.online) { state = 'offline'; cls = 'st-pr-red'; }
    else if (r.busy && r.pr != null) { state = 'checking'; cls = 'st-on-lane'; }
    else if (r.busy) { state = 'other work'; cls = 'st-queued'; }
    else { state = 'free'; cls = 'st-merged'; }
    const who = r.pr != null
      ? '<span class="unit-cell">' + esc((r.unit ? r.unit + ' · ' : '') + 'PR #' + r.pr) + '</span>'
        + (r.job ? '<span class="cell-sub" title="job">' + esc(r.job) + '</span>' : '')
      : '<span class="empty-note">—</span>';
    return '<tr class="' + (r.fleet === false ? 'outside' : '') + (r.online ? '' : ' down') + '">'
      + '<td class="lane-cell" data-label="Slot">' + esc(r.slot || r.name)
      + (r.slot && r.slot !== r.name ? '<span class="cell-sub" title="runner name">' + esc(r.name) + '</span>' : '') + '</td>'
      + '<td data-label="Server">' + esc(r.server || '') + (r.fleet === false ? '<span class="cell-sub">outside the fleet registry</span>' : '') + '</td>'
      + '<td data-label="State"><span class="state-word ' + cls + '">' + state + '</span></td>'
      + '<td data-label="PR">' + who + '</td></tr>';
  }).join('');
  return '<div class="lanes-block ci-block"><div class="lanes-head">' + head + '<span>' + esc(note) + '</span></div>'
    + '<table class="flight-table lanes-table"><colgroup><col style="width:24%"><col style="width:34%">'
    + '<col style="width:21%"><col style="width:21%"></colgroup>'
    + '<thead><tr><th><button type="button" tabindex="-1">Slot</button></th><th><button type="button" tabindex="-1">Server</button></th>'
    + '<th><button type="button" tabindex="-1">State</button></th><th><button type="button" tabindex="-1">PR</button></th></tr></thead><tbody>'
    + (rows || '<tr><td colspan="4"><span class="empty-note">No CI runners known</span></td></tr>')
    + '</tbody></table></div>';
}

function sprintBandLane(u) {
  if (!u.lane) return '<span class="empty-note">—</span>';
  const checking = Boolean(u.lane.check);
  const cls = checking ? 'st-local-check' : (u.lane.busy ? 'st-on-lane' : 'st-lane-idle');
  const mode = checking ? 'checking' : (u.lane.busy ? 'busy' : 'idle');
  const since = checking ? u.lane.check.since : u.lane.since;
  const where = u.lane.server || u.lane.host || '';
  const folder = u.lane.folder && u.lane.folder !== u.lane.lane ? u.lane.host + '/' + u.lane.folder : '';
  return '<span class="' + cls + '" title="' + esc(where + (folder ? ' · folder ' + folder : '')) + '">' + esc(u.lane.lane || '?') + '</span>'
    + '<span class="cell-sub">' + esc(where) + (where ? ' · ' : '') + mode + (since ? ' · ' + esc(since) : '') + '</span>';
}

function sprintBandPr(u) {
  if (u.merged) {
    const content = '#' + esc(u.merged.number) + '<span class="cell-sub st-merged">merged</span>';
    return u.merged.url ? '<a class="st-merged" href="' + esc(u.merged.url)
      + '" target="_blank" rel="noreferrer">' + content + '</a>' : '<span class="st-merged">' + content + '</span>';
  }
  if (u.pr) {
    const ci = u.pr.ci || {};
    const cls = ci.color === 'green' ? 'st-pr-green' : ci.color === 'red' ? 'st-pr-red' : 'st-pr-open';
    const label = '#' + esc(u.pr.number);
    const runner = u.pr.runner && u.pr.runner.name
      ? ' · ' + u.pr.runner.name + (u.pr.runner.host ? ' (' + u.pr.runner.host + ')' : '') : '';
    const detail = '<span class="cell-sub ' + cls + '">' + esc(ci.text || (u.pr.draft ? 'draft' : 'open'))
      + esc(runner) + '</span>';
    return u.pr.url ? '<a class="' + cls + '" href="' + esc(u.pr.url)
      + '" target="_blank" rel="noreferrer">' + label + detail + '</a>' : '<span class="' + cls + '">' + label + detail + '</span>';
  }
  if (u.lane?.check) {
    const check = u.lane.check;
    const detail = [check.cmd, check.since].filter(Boolean).join(' · ');
    return '<span class="st-local-check">local check</span>'
      + (detail ? '<span class="cell-sub" title="' + esc(check.cmd || '') + '">' + esc(detail) + '</span>' : '');
  }
  return '<span class="empty-note">—</span>';
}

function sprintBandSortState(id) {
  if (!sprintBandSort.has(id)) sprintBandSort.set(id, { key: 'unit', dir: 1 });
  return sprintBandSort.get(id);
}

function sprintBandActiveUnits(s, id) {
  const sort = sprintBandSortState(id);
  const units = (s.units || []).filter(u => !u.merged && (u.lane || u.pr));
  const value = u => {
    if (sort.key === 'unit') return sprintBandUnitNumber(u.unit);
    if (sort.key === 'lane') return u.lane ? (u.lane.host || '') + '/' + (u.lane.lane || '') : '';
    if (sort.key === 'pr') return u.pr ? Number(u.pr.number) || 0 : 0;
    return u.state || '';
  };
  return units.sort((a, b) => {
    const av = value(a);
    const bv = value(b);
    const compared = typeof av === 'number' && typeof bv === 'number'
      ? av - bv : String(av).localeCompare(String(bv), undefined, { numeric: true });
    return (compared || sprintBandUnitNumber(a.unit) - sprintBandUnitNumber(b.unit)) * sort.dir;
  });
}

function sprintBandSortButton(c, key, label) {
  const sort = sprintBandSortState(c.id);
  return '<button type="button" class="' + (sort.key === key ? 'active' : '') + '" data-sprint-sort="' + key
    + '" data-sprint-id="' + esc(c.id) + '">' + label
    + (sort.key === key ? (sort.dir > 0 ? ' ↑' : ' ↓') : '') + '</button>';
}

function sprintBandTable(c) {
  const units = sprintBandActiveUnits(c.sprint, c.id);
  const rows = units.map(u => {
    const unitLabel = esc((u.unit || 'unit') + ' #' + u.ticket);
    const unit = u.url ? '<a href="' + esc(u.url) + '" target="_blank" rel="noreferrer">' + unitLabel + '</a>' : unitLabel;
    return '<tr><td class="unit-cell" data-label="Unit">' + unit + '<small title="' + esc(u.title || '') + '">'
      + esc(u.title || 'Untitled unit') + '</small></td><td data-label="Lane">' + sprintBandLane(u) + '</td>'
      + '<td data-label="PR / CI">' + sprintBandPr(u) + '</td><td data-label="State"><span class="state-word '
      + sprintBandStateClass(u) + '">' + esc(u.state || 'queued') + '</span></td></tr>';
  }).join('');
  return '<section class="table-pane"><div class="pane-head"><h3>In flight now</h3><span>' + units.length
    + ' active unit' + (units.length === 1 ? '' : 's') + ' · select a heading to sort</span></div>'
    + '<table class="flight-table"><colgroup><col style="width:24%"><col style="width:25%">'
    + '<col style="width:33%"><col style="width:18%"></colgroup><thead><tr><th>'
    + sprintBandSortButton(c, 'unit', 'Unit + ticket') + '</th><th>'
    + sprintBandSortButton(c, 'lane', 'Lane') + '</th><th>'
    + sprintBandSortButton(c, 'pr', 'PR + CI') + '</th><th>'
    + sprintBandSortButton(c, 'state', 'State') + '</th></tr></thead><tbody>'
    + (rows || '<tr><td colspan="4"><span class="empty-note">No units are in flight right now</span></td></tr>')
    + '</tbody></table></section>';
}

// One line for a folded sprint: what the owner needs to decide whether to
// open it — stage, clock, where the units are, QA, free lanes.
function sprintBandBrief(c) {
  const s = c.sprint || {};
  const cl = calcClocks(c);
  const counts = sprintBandCounts(s);
  const qa = Array.isArray(s.qaTickets) ? s.qaTickets : [];
  const qaOpen = qa.filter(u => u.open && !u.merged).length;
  const active = counts.onLane + counts.checking + counts.pr;
  return '<div class="sprint-brief" data-sprint-toggle="' + esc(c.id) + '" title="open the sprint">'
    + '<span class="caret"></span><span class="name">' + esc(c.title) + '</span>'
    + '<span class="badge">' + esc(STAGE_TITLE[c.stage] ?? c.stage) + '</span>'
    + '<span class="clock"><small>Total</small>' + clockSpan('clk', cl.total, cl.totalFrom) + '</span>'
    + '<span class="stat"><b>' + counts.merged + '</b>/' + counts.units + ' merged</span>'
    + '<span class="stat"><b>' + active + '</b> in flight</span>'
    + (counts.queued ? '<span class="stat"><b>' + counts.queued + '</b> queued</span>' : '')
    + (qa.length || s.umbrellaOpen != null
      ? '<span class="stat qa' + (qaOpen ? '' : ' clean') + '"><b>QA ' + qaOpen + '</b>/' + qa.length
        + (s.umbrellaOpen == null ? '' : ' · umbrella ' + (s.umbrellaOpen ? 'open' : 'closed')) + '</span>'
      : '')
    + '<span class="stat"><b>' + (s.free || []).length + '</b>/' + (Number(s.laneCount) || 0) + ' lanes free</span>'
    + '<span class="hint">click to open</span></div>';
}

function sprintBandPanel(c) {
  const s = c.sprint;
  const cl = calcClocks(c);
  const open = openCards.has(c.id);
  const folded = isSprintFolded(c.id);
  return '<div class="sprint-panel-wrap' + (folded ? ' collapsed' : '') + '" data-sprint-panel="' + esc(c.id) + '" style="--sprint: ' + sprintHue(c.id) + '">'
    + sprintBandBrief(c)
    + '<article class="sprint-panel"><aside class="sprint-summary"><div class="sprint-identity">'
    + '<div class="sprint-name-row"><h3 class="sprint-name">' + esc(c.title) + '</h3>'
    + '<button type="button" class="fold-btn" data-sprint-toggle="' + esc(c.id) + '" title="fold the sprint to one line"><span class="caret"></span>fold</button>'
    + '<button type="button" class="card-toggle" data-sprint-card="' + esc(c.id) + '" aria-expanded="'
    + (open ? 'true' : 'false') + '" title="Toggle the full sprint card">card</button></div>'
    + '<div class="identity-meta"><span class="badge">' + esc(STAGE_TITLE[c.stage] ?? c.stage) + '</span>'
    + '<span class="clock"><small>Total</small>' + clockSpan('clk', cl.total, cl.totalFrom) + '</span></div></div>'
    + sprintBandProgress(s)
    + sprintBandLanes(s) + sprintBandLinks(c, s) + '</aside>'
